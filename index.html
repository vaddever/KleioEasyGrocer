<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eazy Grocer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D;--ink-soft:#4A5573;--line:#E4E7F0;--bg:#F7F9FB;--card:#FFFFFF;
  --teal:#0E8A84;--teal-dark:#0A6560;--teal-soft:#E3F3F2;
  --mango:#F4A300;--mango-soft:#FDF1D9;
  --red:#D64545;--red-soft:#FBE7E7;--green:#2E9E5B;--green-soft:#E4F5EB;
  --purple:#5A46C7;--purple-soft:#EAE6FB;--blue:#1D6FB8;--blue-soft:#E0EEFB;
  --r:14px;--shadow:0 2px 10px rgba(20,33,61,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3,.brand{font-family:'Sora',sans-serif}
a{color:var(--teal);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:12px 0 5px}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:10px 18px;border-radius:10px;border:none;font-weight:600;font-size:14px;transition:.15s}
.btn-p{background:var(--teal);color:#fff}.btn-p:hover{background:var(--teal-dark)}
.btn-o{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.btn-ghost{background:transparent;color:var(--ink-soft)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.hwrap{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px}
.brand{font-weight:800;font-size:19px;color:var(--ink);white-space:nowrap}.brand b{color:var(--teal)}
nav{margin-left:auto;display:flex;gap:4px;align-items:center}
nav a{padding:7px 12px;border-radius:8px;color:var(--ink-soft);font-weight:600;font-size:14px;white-space:nowrap}
nav a.active,nav a:hover{background:var(--teal-soft);color:var(--teal-dark)}
.cartbtn{position:relative;padding:6px 10px;border-radius:8px;font-size:20px;line-height:1;color:var(--ink)}
.cartbtn:hover{background:var(--teal-soft)}
.cartbadge{position:absolute;top:-4px;right:-4px;background:var(--mango);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 6px}

main{max-width:1100px;margin:0 auto;padding:24px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:16px}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.muted{color:var(--ink-soft);font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.b-new{background:var(--mango-soft);color:#9a6a00}
.b-accepted{background:var(--teal-soft);color:var(--teal-dark)}
.b-preparing{background:var(--purple-soft);color:var(--purple)}
.b-out_for_delivery{background:var(--blue-soft);color:var(--blue)}
.b-delivered{background:var(--green-soft);color:var(--green)}
.b-cancelled{background:var(--red-soft);color:var(--red)}
.b-active,.b-paid{background:var(--green-soft);color:var(--green)}
.b-pending,.b-unpaid,.b-pending_transfer{background:var(--mango-soft);color:#9a6a00}
.b-suspended{background:var(--red-soft);color:var(--red)}
.b-refund_requested{background:var(--purple-soft);color:var(--purple)}
.b-refunded{background:var(--blue-soft);color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:8px 10px;border-bottom:1.5px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--ink-soft)}
.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}

.hero{padding:34px 0 26px}
.hero h1{font-size:clamp(26px,4.5vw,40px);font-weight:800;letter-spacing:-.02em}
.hero h1 span{color:var(--teal)}
.hero p{color:var(--ink-soft);margin-top:8px;max-width:520px}
.wave{height:5px;width:120px;margin-top:14px;border-radius:99px;background:repeating-linear-gradient(90deg,var(--teal) 0 14px,var(--mango) 14px 20px)}

.store{cursor:pointer;transition:.15s;overflow:hidden}
.store:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(20,33,61,.1)}
.store .cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mango)}
.store h3{margin:4px 0 6px;font-size:17px}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--teal-soft);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Sora';font-size:18px;margin-bottom:10px}
.store-banner{width:100%;height:110px;object-fit:cover;border-radius:10px;margin-bottom:10px}
.prod-img{width:58px;height:58px;object-fit:cover;border-radius:8px;flex-shrink:0}
.prod{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.prod:last-child{border:none}
.price{font-weight:700;color:var(--teal-dark);white-space:nowrap}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:700;flex-shrink:0}

.modal-bg{position:fixed;inset:0;background:rgba(20,33,61,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px 16px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px}
.modal h2{font-size:19px;margin-bottom:6px}

.tl{margin:16px 0;padding-left:4px}
.tl-step{display:flex;gap:12px;padding-bottom:18px;position:relative}
.tl-step:before{content:'';position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl-step:last-child:before{display:none}
.dot{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);background:#fff;flex-shrink:0;z-index:1}
.tl-step.done .dot{background:var(--teal);border-color:var(--teal)}
.tl-step.done:before{background:var(--teal)}

.pay-opt{border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.15s;margin-bottom:10px}
.pay-opt:hover,.pay-opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.pay-opt h4{margin-bottom:3px}

.addr-wrap{position:relative}
.addr-sug{position:absolute;top:calc(100% + 2px);left:0;right:0;background:#fff;border:1.5px solid var(--teal);border-radius:10px;z-index:10;max-height:160px;overflow:auto}
.addr-sug div{padding:9px 12px;cursor:pointer;font-size:14px}
.addr-sug div:hover{background:var(--teal-soft)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;font-size:14px;z-index:200;display:none;white-space:nowrap;max-width:90vw}
.empty{text-align:center;padding:48px 20px;color:var(--ink-soft)}
.empty .big{font-size:34px;margin-bottom:8px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.kpi .card{padding:14px}
.kpi .n{font-family:'Sora';font-weight:800;font-size:22px}
.kpi .l{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:2px}
.hidden{display:none!important}
.notif-btn{background:var(--mango-soft);color:#9a6a00;border:none;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.slip-img{max-width:100%;max-height:180px;border-radius:8px;border:1px solid var(--line);display:block;margin-top:6px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.cat-card{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;transition:.15s;position:relative}
.cat-card.selectable{cursor:pointer}.cat-card.selected{border-color:var(--teal);background:var(--teal-soft)}
.cat-card img{display:block;margin:0 auto 8px;width:70px;height:70px;object-fit:contain}
.cat-card .iname{font-size:13px;font-weight:600;line-height:1.3}
.sel-check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;display:none;align-items:center;justify-content:center}
.cat-card.selected .sel-check{display:flex}
.btn-wa{background:#25D366;color:#fff;border:none}.btn-wa:hover{background:#1da851}
.btn-viber{background:#7360F2;color:#fff;border:none}.btn-viber:hover{background:#5a47d4}
.price-warn{color:var(--mango);font-size:12px;font-weight:600}
.site-footer{max-width:1100px;margin:0 auto;padding:20px;text-align:center;color:var(--ink-soft);font-size:13px;border-top:1px solid var(--line)}
.site-footer a{color:var(--teal);font-weight:700}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;margin-bottom:16px;font-size:14px}
.banner>div{flex:1}
.banner-amber{background:var(--mango-soft);border:1px solid var(--mango)}
.banner-red{background:var(--red-soft);border:1px solid var(--red)}
.banner-green{background:var(--green-soft);border:1px solid var(--green)}
.promo-strip{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
.promo{background:var(--mango-soft);border:1px dashed var(--mango);border-radius:10px;padding:9px 13px;font-size:13px;line-height:1.4}
.paste-zone{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;outline:none;transition:.15s}
.paste-zone:focus{border-color:var(--teal)}
.paste-zone.ok{border-color:var(--teal);background:var(--teal-soft)}
.copy-mini{background:var(--teal-soft);border:none;border-radius:7px;padding:4px 9px;cursor:pointer;font-size:13px;color:var(--teal-dark);font-weight:700}
.draw-spin{font-family:'Sora',sans-serif;font-weight:800;font-size:26px;letter-spacing:.04em;margin:6px 0}
@media(max-width:640px){
  .hwrap{padding:10px 14px 8px;flex-wrap:wrap;gap:6px 10px}
  .brand{order:1;font-size:20px}
  .cartbtn{order:2;margin-left:auto;font-size:22px}
  nav{order:3;width:100%;margin-left:0;gap:6px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{flex:1 0 auto;text-align:center;padding:8px 10px;font-size:13.5px;background:var(--bg)}
  nav a.active{background:var(--teal-soft)}
  main{padding:16px 14px 70px}.grid-3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <a class="brand" href="#/">Eazy <b>Grocer</b></a>
    <nav id="nav">
      <a href="#/" data-r="home">Stores</a>
      <a href="#/orders" data-r="orders">My orders</a>
      <a href="#/track" data-r="track">Track</a>
      <a href="#/biz" data-r="biz">For businesses</a>
      <a href="#/admin" data-r="admin" id="adminLink" class="hidden">Admin</a>
    </nav>
    <a href="#" id="cartLink" class="cartbtn" aria-label="Cart">🛒<span class="cartbadge hidden" id="cartCount">0</span></a>
  </div>
</header>
<main id="app"></main>
<footer class="site-footer">Owned by <strong>Kleio Pvt Ltd</strong> &nbsp;·&nbsp; Contact <a href="tel:7877880">7877880</a></footer>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.6.0/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== CONFIG — paste your Firebase project details here ===== */
const firebaseConfig={
  apiKey:"AIzaSyCCWOuycDkcsmwFu7DIrPR1PFRf23oZwk8",
  authDomain:"bizz-eazy.firebaseapp.com",
  projectId:"bizz-eazy",
  storageBucket:"bizz-eazy.firebasestorage.app",
  messagingSenderId:"1090705757043",
  appId:"1:1090705757043:web:7fc3e8e835796559246b06",
  measurementId:"G-6YBCHRG8F1"
};
const ADMIN_EMAILS=["vaddever@gmail.com"];
/* ============================================================= */

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
const FV=firebase.firestore.FieldValue;

const CATS=["Food & Café","Grocery","Bakery","Fashion","Electronics","Services","Other"];
const FLOW=["new","accepted","preparing","out_for_delivery","delivered"];
const SL={new:"New",accepted:"Accepted",preparing:"Preparing",out_for_delivery:"Out for delivery",delivered:"Delivered",cancelled:"Cancelled"};
const PL={unpaid:"Unpaid",pending_transfer:"Payment submitted",paid:"Paid",refund_requested:"Refund requested",refunded:"Refunded"};

let user=null,myBiz=null,isAdmin=false,notifUnsub=null;
let unsub=[];

/* ── helpers ── */
const $=id=>document.getElementById(id);
const app=$("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mvr=n=>"MVR "+Number(n||0).toFixed(2);
const fmtDate=ts=>{const d=ts?.toDate?ts.toDate():(ts?new Date(ts):null);return d?d.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—"};
function toast(m,ms=2800){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",ms)}
function openModal(html){$("modalBox").innerHTML=html;$("modalBg").classList.add("open")}
function closeModal(){$("modalBg").classList.remove("open")}
$("modalBg").onclick=e=>{if(e.target.id==="modalBg")closeModal()};

/* ── local storage ── */
let cart=JSON.parse(localStorage.getItem("eb_cart")||"{}");
function saveCart(){localStorage.setItem("eb_cart",JSON.stringify(cart));updateBadge()}
function cartCount(){let n=0;for(const b in cart)for(const p in cart[b].items)n+=cart[b].items[p].qty;return n}
function updateBadge(){const n=cartCount(),el=$("cartCount");if(el){el.textContent=n;el.classList.toggle("hidden",!n)}}
function getAddrs(){return JSON.parse(localStorage.getItem("eb_addrs")||"[]")}
function saveAddr(a){if(!a)return;const l=getAddrs().filter(x=>x!==a);l.unshift(a);localStorage.setItem("eb_addrs",JSON.stringify(l.slice(0,8)))}
function getMyOrders(){return JSON.parse(localStorage.getItem("eb_myorders")||"[]")}
function saveMyOrder(o){const l=getMyOrders().filter(x=>x.code!==o.code);l.unshift(o);localStorage.setItem("eb_myorders",JSON.stringify(l.slice(0,30)))}

/* ── image compression ── */
function compressImg(file,mw=500,mh=500,q=0.75){
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>mw){h=h*(mw/w);w=mw}if(h>mh){w=w*(mh/h);h=mh}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",q));
    };img.onerror=()=>res(null);img.src=url;
  });
}

/* ── subscription / promotion helpers ── */
const TRIAL_DAYS=90,WARN_DAYS=10;
const DEFAULT_PLANS=[
  {name:"Basic",price:99,period:"mo",desc:"Everything you need to run your store"},
  {name:"Pro",price:249,period:"mo",desc:"For busy stores — priority support"}
];
const toDate=x=>x?(x.toDate?x.toDate():new Date(x)):null;
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayStr=()=>ymd(new Date());
const fmtD=s=>s?new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"";
function daysLeft(biz){
  const e=toDate(biz&&biz.planExpiry);if(!e)return null;
  const ms=e-new Date();
  return ms<0?-Math.ceil(-ms/864e5):Math.ceil(ms/864e5);
}
function isExpired(biz){const e=toDate(biz&&biz.planExpiry);return !!e&&e<new Date()}
function addPeriod(base,period){const d=new Date(base);if(period==="yr")d.setFullYear(d.getFullYear()+1);else d.setMonth(d.getMonth()+1);return d}
function notifGranted(){return "Notification" in window&&Notification.permission==="granted"}
function calcTotals(items,disc){
  const r2=n=>Math.round(n*100)/100;
  const subtotal=r2(items.reduce((s,i)=>s+Number(i.price)*Number(i.qty),0));
  let amount=0;
  if(disc){amount=disc.kind==="percent"?Math.round(subtotal*Number(disc.value))/100:Math.min(Number(disc.value),subtotal)}
  amount=r2(Math.max(0,amount));
  return{subtotal,amount,total:r2(subtotal-amount)};
}
async function newOrderCode(){
  const c="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  for(let n=0;n<6;n++){
    let s="EG-";for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];
    try{const d=await db.collection("orders").doc(s).get();if(!d.exists)return s}catch(e){return s}
  }
  throw new Error("Could not generate an order code");
}

/* ── auth ── */
let authReady=false,bizDocUnsub=null,adminWatch=null;
auth.onAuthStateChanged(async u=>{
  user=u;isAdmin=!!u&&ADMIN_EMAILS.includes(u.email);
  $("adminLink").classList.toggle("hidden",!isAdmin);
  myBiz=null;
  if(notifUnsub){notifUnsub();notifUnsub=null}
  if(bizDocUnsub){bizDocUnsub();bizDocUnsub=null}
  if(adminWatch){adminWatch();adminWatch=null}
  try{
    if(u&&!isAdmin){
      const s=await db.collection("businesses").where("ownerUid","==",u.uid).limit(1).get();
      if(!s.empty)myBiz={id:s.docs[0].id,...s.docs[0].data()};
    }
  }catch(e){console.error("Could not load business",e)}
  authReady=true;
  route();
});

/* ── router ── */
window.addEventListener("hashchange",route);
function route(){
  clearUnsubs();
  const h=location.hash||"#/";
  document.querySelectorAll("nav a[data-r]").forEach(a=>a.classList.remove("active"));
  if(!authReady&&(h==="#/biz"||h==="#/admin")){
    mark(h==="#/biz"?"biz":"admin");
    app.innerHTML=`<div class="empty"><div class="big">⏳</div>Loading…</div>`;
    return;
  }
  if(h==="#/"){mark("home");vHome()}
  else if(h.startsWith("#/store/")){mark("home");vStore(h.split("/")[2])}
  else if(h==="#/orders"){mark("orders");vMyOrders()}
  else if(h.startsWith("#/track")){mark("track");vTrack(h.split("/")[2]||"")}
  else if(h==="#/biz"){mark("biz");vBiz()}
  else if(h==="#/admin"){mark("admin");vAdmin()}
  else vHome();
  updateBadge();
}
function mark(r){const a=document.querySelector(`nav a[data-r="${r}"]`);a&&a.classList.add("active")}
function clearUnsubs(){unsub.forEach(u=>u&&u());unsub=[]}

/* ── notifications ── */
async function askNotif(){
  if(!("Notification" in window))return false;
  if(Notification.permission==="granted")return true;
  return(await Notification.requestPermission())==="granted";
}
function fireNotif(title,body){if(notifGranted()){try{new Notification(title,{body})}catch(e){}}}
function startNotifWatch(bizId){
  if(notifUnsub)notifUnsub();let first=true;
  notifUnsub=db.collection("orders").where("bizId","==",bizId).where("status","==","new")
    .onSnapshot(snap=>{
      if(first){first=false;return}
      snap.docChanges().filter(c=>c.type==="added").forEach(c=>{
        const o=c.doc.data();
        fireNotif("🛍️ New order!",`${o.code} — ${o.customer?.name||""} — ${mvr(o.total)}`);
        toast("🔔 New order: "+o.code,4000);
      });
    },()=>{});
}

/* =========================================================
   CUSTOMER: HOME
   ========================================================= */
async function vHome(){
  app.innerHTML=`
    <div class="hero">
      <h1>Your local grocery, <span>delivered eazy</span>.</h1>
      <p>Browse stores across the Maldives, order fresh groceries in minutes, and track right to your door.</p>
      <div class="wave"></div>
    </div>
    <div id="promoStrip"></div>
    <div class="tabs" id="catTabs"></div>
    <div class="grid grid-3" id="storeGrid"><div class="empty">Loading stores…</div></div>`;
  let activeCat="All";
  const tabs=$("catTabs");
  ["All",...CATS].forEach(c=>{
    const b=document.createElement("button");b.className="tab"+(c==="All"?" active":"");b.textContent=c;
    b.onclick=()=>{activeCat=c;tabs.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));b.classList.add("active");render()};
    tabs.appendChild(b);
  });
  let stores=[];
  try{const s=await db.collection("businesses").where("status","==","active").get();stores=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!isExpired(x))}
  catch{$("storeGrid").innerHTML=`<div class="empty">Could not load stores.</div>`;return}
  function isOpen(biz){
    if(!biz.openTime||!biz.closeTime)return null;
    const now=new Date(),cur=now.getHours()*60+now.getMinutes();
    const[oh,om]=biz.openTime.split(":").map(Number),[ch,cm]=biz.closeTime.split(":").map(Number);
    return cur>=oh*60+om&&cur<=ch*60+cm;
  }
  function render(){
    const list=stores.filter(s=>activeCat==="All"||s.category===activeCat);
    $("storeGrid").innerHTML=list.length?list.map(s=>{
      const open=isOpen(s);
      return`<div class="card store" onclick="location.hash='#/store/${s.id}'">
        ${s.logoImg?`<img class="store-banner" src="${s.logoImg}" alt="">`:`<div class="avatar">${esc((s.name||"?")[0].toUpperCase())}</div>`}
        <div class="cat">${esc(s.category||"Store")}</div>
        <h3>${esc(s.name)}</h3>
        <div class="muted">${esc(s.tagline||s.island||"")}</div>
        ${open!==null?`<div class="muted" style="margin-top:4px">${open?'🟢 Open':'🔴 Closed'} · ${esc(s.openTime)}–${esc(s.closeTime)}</div>`:""}</div>`
    }).join(""):`<div class="empty"><div class="big">🏝️</div>No stores here yet.</div>`;
  }
  render();
  fetchPromos(null).then(ps=>{const el=$("promoStrip");if(el)el.innerHTML=promoBannerHTML(ps)});
}

/* =========================================================
   CUSTOMER: STORE
   ========================================================= */
async function vStore(bizId){
  app.innerHTML=`<div class="empty">Loading store…</div>`;
  const doc=await db.collection("businesses").doc(bizId).get();
  if(!doc.exists||doc.data().status!=="active"){app.innerHTML=`<div class="empty">This store is not available.</div>`;return}
  const biz={id:doc.id,...doc.data()};
  if(isExpired(biz)){app.innerHTML=`<div class="empty"><div class="big">🕒</div>This store is temporarily unavailable.</div>`;return}
  const prods=(await db.collection("businesses").doc(bizId).collection("products").where("available","==",true).get()).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.sortOrder||99)-(b.sortOrder||99)||a.name.localeCompare(b.name));
  const promos=await fetchPromos(bizId);
  prods.forEach(p=>{const pct=salePctFor(p,promos);if(pct){p.salePct=pct;p.salePrice=Math.round(p.price*(100-pct))/100}});
  app.innerHTML=`
    <a href="#/" class="muted">← All stores</a>
    <div class="row spread" style="margin:14px 0 20px">
      <div class="row">
        ${biz.logoImg?`<img src="${biz.logoImg}" style="width:50px;height:50px;border-radius:12px;object-fit:cover">`:`<div class="avatar" style="margin:0">${esc(biz.name[0].toUpperCase())}</div>`}
        <div><h2>${esc(biz.name)}</h2>
          <div class="muted">${esc(biz.category||"")}${biz.island?" · "+esc(biz.island):""}${biz.phone?" · "+esc(biz.phone):""}</div>
          ${biz.openTime?`<div class="muted">Hours: ${esc(biz.openTime)} – ${esc(biz.closeTime)}</div>`:""}
        </div>
      </div>
      <div class="row">
        <button class="btn btn-o btn-sm" onclick="shareStore('${location.origin+location.pathname}#/store/${biz.id}','${esc(biz.name)}')">📤 Share</button>
        <button class="btn btn-p" onclick="showCart()">🛒 View cart</button>
      </div>
    </div>
    ${promoBannerHTML(promos)}
    <div class="card" id="prodList">
      ${prods.length?prods.map(p=>`
        <div class="prod">
          ${(p.imageUrl||p.imageData)?`<img class="prod-img" src="${p.imageUrl||p.imageData}" alt="">`:``}
          <div style="flex:1"><strong>${esc(p.name)}</strong><div class="muted">${esc(p.desc||"")}</div>${p.salePct?`<div style="margin-top:4px"><span class="price">${mvr(p.salePrice)}</span> <s class="muted">${mvr(p.price)}</s> <span class="badge b-new">-${p.salePct}%</span></div>`:`<div class="price" style="margin-top:4px">${mvr(p.price)}</div>`}</div>
          <div class="qty">
            <button onclick="chQty('${biz.id}','${p.id}',-1)">−</button>
            <span id="q_${p.id}">${cart[biz.id]?.items[p.id]?.qty||0}</span>
            <button onclick="chQty('${biz.id}','${p.id}',1)">+</button>
          </div>
        </div>`).join(""):`<div class="empty">No products listed yet.</div>`}
    </div>`;
  window._SP=Object.fromEntries(prods.map(p=>[p.id,p]));
  window._SB=biz;
  // cache wa number in cart for quick access
  if(cart[bizId])cart[bizId].waNumber=biz.whatsappNumber||'';
  saveCart();
}
window.chQty=(bid,pid,d)=>{
  const p=window._SP[pid],biz=window._SB;
  if(!cart[bid])cart[bid]={bizName:biz.name,items:{}};
  const eff=p.salePrice??p.price;
  const it=cart[bid].items[pid]||{name:p.name,price:eff,qty:0};
  it.price=eff;
  it.qty=Math.max(0,it.qty+d);
  if(!it.qty)delete cart[bid].items[pid];else cart[bid].items[pid]=it;
  if(!Object.keys(cart[bid].items).length)delete cart[bid];
  const el=$("q_"+pid);if(el)el.textContent=it.qty;
  saveCart();
};

window.showCart=()=>{
  const bids=Object.keys(cart);
  if(!bids.length){openModal(`<h2>Your cart</h2><div class="empty"><div class="big">🛒</div>Cart is empty.</div><button class="btn btn-o" style="width:100%" onclick="closeModal()">Close</button>`);return}
  openModal(`<h2>Your cart</h2>${bids.map(b=>{
    const c=cart[b],total=Object.values(c.items).reduce((s,i)=>s+i.price*i.qty,0);
    return`<div style="margin:14px 0"><strong>${esc(c.bizName)}</strong>
      ${Object.entries(c.items).map(([,i])=>`<div class="row spread" style="padding:5px 0"><span>${esc(i.name)} × ${i.qty}</span><span class="price">${mvr(i.price*i.qty)}</span></div>`).join("")}
      <div class="row spread" style="border-top:1.5px solid var(--line);padding-top:8px"><strong>Total</strong><strong class="price">${mvr(total)}</strong></div>
      <button class="btn btn-p" style="width:100%;margin-top:10px" onclick="checkout('${b}')">Checkout — ${esc(c.bizName)}</button>
      ${c.waNumber?`<button class="btn btn-wa" style="width:100%;margin-top:6px" onclick="orderViaWhatsApp('${b}')">📲 Order via WhatsApp</button>`:""}
    </div>`
  }).join("<hr style='border:none;border-top:1px solid var(--line)'>")}<button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="cart={};saveCart();closeModal()">Clear all</button>`);
};

window.checkout=(bizId,mode)=>{
  const c=cart[bizId];if(!c)return;
  const addrs=getAddrs(),prof=JSON.parse(localStorage.getItem("eb_profile")||"{}");
  const wa=mode==="wa";
  window._ckDisc=null;
  openModal(`<h2>${wa?"Order via WhatsApp":"Checkout"}</h2><div class="muted" style="margin-bottom:8px">${esc(c.bizName)}</div>
    ${wa?`<p class="muted" style="margin-bottom:6px">📲 Your order is saved in the portal and also sent to the store on WhatsApp.</p>`:""}
    <label>Your name</label><input id="cName" value="${esc(prof.name||"")}">
    <label>Phone</label><input id="cPhone" placeholder="7XXXXXX" value="${esc(prof.phone||"")}">
    <label>Delivery address</label>
    <div class="addr-wrap">
      <input id="cAddr" placeholder="House / road / island" autocomplete="off" oninput="filterAddrs(this.value)">
      ${addrs.length?`<div class="addr-sug" id="addrSug">${addrs.map(a=>`<div onclick="pickAddr('${esc(a)}')">${esc(a)}</div>`).join("")}</div>`:""}
    </div>
    <label>Note (optional)</label><input id="cNote">
    <label>Promo code (optional)</label>
    <div class="row" style="flex-wrap:nowrap"><input id="cPromo" placeholder="e.g. SAVE10" style="text-transform:uppercase"><button class="btn btn-o btn-sm" type="button" onclick="applyPromo('${bizId}')">Apply</button></div>
    <div id="promoMsg" class="muted" style="margin-top:4px"></div>
    <div id="ckSummary" style="margin-top:12px"></div>
    <button class="btn ${wa?"btn-wa":"btn-p"}" style="width:100%;margin-top:14px" id="placeBtn">${wa?"📲 Place order via WhatsApp":"Place order"}</button>`);
  renderCkSummary(bizId);
  $("placeBtn").onclick=async()=>{
    const name=$("cName").value.trim(),phone=$("cPhone").value.trim(),addr=$("cAddr").value.trim();
    if(!name||!phone||!addr){toast("Name, phone and address are required");return}
    const btn=$("placeBtn");btn.disabled=true;
    const w=wa?window.open("about:blank","_blank"):null;
    const items=Object.entries(c.items).map(([pid,i])=>({productId:pid,name:i.name,price:i.price,qty:i.qty}));
    const t=calcTotals(items,window._ckDisc);
    const disc=window._ckDisc?{...window._ckDisc,amount:t.amount}:null;
    const note=$("cNote").value.trim();
    try{
      const code=await newOrderCode();
      await db.collection("orders").doc(code).set({
        code,bizId,bizName:c.bizName,
        customer:{name,phone,address:addr,note},
        items,subtotal:t.subtotal,discount:disc,total:t.total,
        status:"new",paymentStatus:"unpaid",source:wa?"whatsapp":"web",
        createdAt:FV.serverTimestamp(),history:[{status:"new",at:new Date().toISOString()}]
      });
      saveAddr(addr);
      localStorage.setItem("eb_profile",JSON.stringify({name,phone}));
      saveMyOrder({code,bizName:c.bizName,total:t.total,date:new Date().toISOString(),status:"new"});
      const waNum=(c.waNumber||"").replace(/\D/g,"");
      delete cart[bizId];saveCart();closeModal();
      if(wa&&waNum){
        const list=items.map(i=>"• "+i.name+" × "+i.qty+" — MVR "+(i.price*i.qty).toFixed(2)).join("\n");
        const msg="*New order — Eazy Grocer* 🛒\n\n*Code:* "+code+"\n*Store:* "+c.bizName+"\n\n*Customer:*\nName: "+name+"\nPhone: "+phone+"\nAddress: "+addr+(note?"\nNote: "+note:"")+"\n\n*Items:*\n"+list+(disc?"\n\nDiscount ("+disc.code+"): -MVR "+t.amount.toFixed(2):"")+"\n\n*Total: MVR "+t.total.toFixed(2)+"*\n\nTrack: "+location.origin+location.pathname+"#/track/"+code;
        const url="https://wa.me/"+waNum+"?text="+encodeURIComponent(msg);
        if(w)w.location.href=url;else window.open(url,"_blank");
      }else if(w){w.close()}
      location.hash="#/track/"+code;
      toast("Order placed! Code: "+code,5000);
    }catch(e){
      console.error(e);if(w)w.close();
      toast("Could not place order. Please try again.");btn.disabled=false;
    }
  };
};
window.orderViaWhatsApp=bizId=>{
  if(!cart[bizId]?.waNumber){toast("This store hasn't enabled WhatsApp ordering.");return}
  checkout(bizId,"wa");
};
window.applyPromo=async bizId=>{
  const code=($("cPromo").value||"").trim().toUpperCase(),msg=$("promoMsg");
  if(!code){window._ckDisc=null;msg.textContent="";renderCkSummary(bizId);return}
  msg.style.color="";msg.textContent="Checking…";
  const sub=calcTotals(Object.values(cart[bizId].items),null).subtotal;
  try{
    const snap=await db.collection("promotions").where("code","==",code).where("active","==",true).get();
    const p=snap.docs.map(d=>({id:d.id,...d.data()})).find(x=>x.type==="discount"&&promoLive(x)&&(x.scope==="portal"||x.bizId===bizId));
    if(!p){window._ckDisc=null;msg.style.color="var(--red)";msg.textContent="❌ Invalid or expired code"}
    else if(p.minOrder&&sub<p.minOrder){window._ckDisc=null;msg.style.color="var(--red)";msg.textContent="❌ This code needs a minimum order of "+mvr(p.minOrder)}
    else{
      window._ckDisc={code:p.code,title:p.title||"",kind:p.kind,value:Number(p.value),promoId:p.id,scope:p.scope};
      msg.style.color="var(--green)";msg.textContent="✅ "+(p.title||"Code applied");
    }
  }catch(e){window._ckDisc=null;msg.style.color="var(--red)";msg.textContent="Could not check the code right now"}
  renderCkSummary(bizId);
};
window.renderCkSummary=bizId=>{
  const c=cart[bizId];if(!c||!$("ckSummary"))return;
  const t=calcTotals(Object.values(c.items),window._ckDisc);
  $("ckSummary").innerHTML=`<div class="row spread" style="padding:2px 0"><span class="muted">Subtotal</span><span>${mvr(t.subtotal)}</span></div>
    ${t.amount?`<div class="row spread" style="padding:2px 0;color:var(--green)"><span>Discount (${esc(window._ckDisc.code)})</span><span>− ${mvr(t.amount)}</span></div>`:""}
    <div class="row spread" style="border-top:1.5px solid var(--line);margin-top:6px;padding-top:6px"><strong>Total</strong><strong class="price" style="font-size:17px">${mvr(t.total)}</strong></div>`;
};
window.pickAddr=addr=>{const el=$("cAddr");if(el){el.value=addr;const s=$("addrSug");if(s)s.style.display="none"}};
window.filterAddrs=v=>{const s=$("addrSug");if(!s)return;const lower=v.toLowerCase();s.querySelectorAll("div").forEach(d=>d.style.display=d.textContent.toLowerCase().includes(lower)?"":"none")};

function vTrack(code){
  app.innerHTML=`
    <h2 style="margin-bottom:6px">Track your order</h2>
    <p class="muted">Enter the order code from your confirmation (e.g. EG-XXXXXX).</p>
    <div class="row" style="margin:16px 0;max-width:420px">
      <input id="tCode" value="${esc(code)}" placeholder="EG-XXXXXX" style="text-transform:uppercase">
      <button class="btn btn-p" onclick="doTrack()">Track</button>
    </div>
    <div id="tRes"></div>`;
  if(code)trackLive(code.toUpperCase());
}
window.doTrack=()=>{const v=$("tCode").value.trim().toUpperCase();if(v)location.hash="#/track/"+v};

function trackLive(code){
  const box=$("tRes");box.innerHTML=`<div class="empty">Searching…</div>`;
  const u=db.collection("orders").doc(code).onSnapshot(snap=>{
    if(!snap.exists){box.innerHTML=`<div class="empty"><div class="big">🔍</div>Order <strong>${esc(code)}</strong> not found.</div>`;return}
    const oid=snap.id,o=snap.data();
    const idx=o.status==="cancelled"?-1:FLOW.indexOf(o.status);
    const isPaid=o.paymentStatus==="paid";
    const canPay=o.status==="accepted"&&(o.paymentStatus==="unpaid");
    const slipPending=o.status==="accepted"&&o.paymentStatus==="pending_transfer";
    // sync local status
    const llist=getMyOrders(),lf=llist.find(x=>x.code===code);
    if(lf){lf.status=o.status;localStorage.setItem("eb_myorders",JSON.stringify(llist))}
    box.innerHTML=`<div class="card" style="max-width:560px">
      <div class="row spread">
        <div><strong style="font-size:16px">${esc(o.code)}</strong><div class="muted">${esc(o.bizName)} · ${fmtDate(o.createdAt)}</div></div>
        <div style="text-align:right">${statusBadges(o)}</div>
      </div>
      ${o.status==="cancelled"?`<div style="margin-top:12px;padding:14px;background:var(--red-soft);border-radius:10px;color:var(--red)">
        <strong>❌ Order cancelled</strong>
        ${o.cancelReason?`<br><span style="color:var(--ink-soft)">Reason: ${esc(o.cancelReason)}</span>`:""}
        ${o.paymentStatus==="refund_requested"?`<br><span style="color:var(--purple)">Refund requested — being processed by the store.</span>`:""}
        ${o.paymentStatus==="refunded"?`<br><span style="color:var(--green)">✅ Refund has been issued.</span>`:""}
      </div>`:
      `<div class="tl" style="margin-top:18px">${FLOW.map((s,i)=>`
        <div class="tl-step ${i<=idx?"done":""}"><div class="dot"></div>
          <div><strong>${SL[s]}</strong><div class="muted">${i<=idx?"Done":"Waiting"}</div></div>
        </div>`).join("")}</div>`}
      ${canPay?`<div style="border-top:1px solid var(--line);padding-top:14px">
        <p style="font-weight:700;margin-bottom:12px">💳 Order accepted — complete payment to proceed</p>
        <div id="payZone"></div></div>`:""}
      ${slipPending?`<div style="border-top:1px solid var(--line);padding-top:12px;margin-top:4px">
        <p class="muted">⏳ Payment submitted — waiting for the store to confirm.</p></div>`:""}
      <div style="border-top:1px solid var(--line);padding-top:12px;margin-top:8px">
        ${o.items.map(i=>`<div class="row spread" style="padding:3px 0"><span>${esc(i.name)} × ${i.qty}</span><span class="price">${mvr(i.price*i.qty)}</span></div>`).join("")}
        ${o.discount&&o.discount.amount?`<div class="row spread" style="padding:3px 0;color:var(--green)"><span>Discount (${esc(o.discount.code)})</span><span>− ${mvr(o.discount.amount)}</span></div>`:""}
        <div class="row spread" style="margin-top:8px"><strong>Total</strong><strong class="price">${mvr(o.total)}</strong></div>
      </div>
      <div id="drawNote" style="margin-top:10px"></div>
      ${isPaid&&o.status!=="delivered"&&o.status!=="cancelled"?`<div style="margin-top:12px"><button class="btn btn-danger btn-sm" onclick="reqRefund('${oid}')">↩️ Request refund & cancel</button></div>`:""}
    </div>`;
    if(canPay)loadPay(oid,o);
    showDrawNote(o);
  },()=>{box.innerHTML=`<div class="empty">Could not load order.</div>`});
  unsub.push(u);
}

        </div></div>`:""}

    </div>`:""}
    ${biz.acceptsCard&&biz.cardLink?`<div class="pay-opt" id="poCard" onclick="selPay('card')"><h4>💳 Pay by card</h4><div class="muted">Tap to pay via card link</div></div>`:""}
    ${biz.acceptsTransfer!==false?`<div class="pay-opt ${!biz.acceptsCard||!biz.cardLink?"sel":""}" id="poTransfer" onclick="selPay('transfer')"><h4>🏦 I've done the bank transfer</h4><div class="muted">Attach your transfer slip / receipt</div></div>`:""}

      <div style="margin-top:12px">
        <label style="margin-bottom:6px">Attach transfer slip / receipt</label>
        <div id="pasteZone" tabindex="0"
          style="border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer;transition:.15s;outline:none;margin-bottom:10px"
          onclick="this.focus()"

          onpaste="handleSlipPaste(event)">
          <div style="font-size:22px;margin-bottom:6px">📋</div>
          <div style="font-weight:600;font-size:14px">Click here, then Ctrl+V / ⌘V to paste</div>
          <div class="muted" style="font-size:12px">Screenshot, photo or any image from clipboard</div>
        </div>
        <div class="row" style="align-items:center;gap:8px;margin-bottom:10px">
          <hr style="flex:1;border:none;border-top:1px solid var(--line)">
          <span class="muted" style="font-size:12px;white-space:nowrap">or upload a file</span>
          <hr style="flex:1;border:none;border-top:1px solid var(--line)">
        </div>
        <input type="file" id="slipFile" accept="image/*" onchange="prevSlip(this)">
        <img id="slipPrev" style="display:none;max-width:100%;max-height:200px;border-radius:8px;margin-top:8px;border:1px solid var(--line)">
        <button class="btn btn-p" style="width:100%;margin-top:12px" id="submitSlipBtn" onclick="submitSlip()">Submit transfer slip</button>
      </div>`;
  }
};
window.prevSlip=inp=>{
  if(!inp.files[0])return;
  const r=new FileReader();r.onload=e=>{
    const p=$("slipPrev");if(p){p.src=e.target.result;p.style.display="block"}
    window._pastedSlip=null; // file takes precedence
  };r.readAsDataURL(inp.files[0]);
};
window.handleSlipPaste=async e=>{
  const items=e.clipboardData?.items;if(!items)return;
  for(const item of items){
    if(item.type.startsWith("image/")){
      e.preventDefault();
      const file=item.getAsFile();
      const b64=await compressImg(file,900,1100,0.65);
      if(b64){
        window._pastedSlip=b64;
        const p=$("slipPrev");if(p){p.src=b64;p.style.display="block"}
        const pz=$("pasteZone");if(pz){pz.style.borderColor="var(--teal)";pz.style.background="var(--teal-soft)";pz.innerHTML=`<div style="font-size:22px">✅</div><div style="font-weight:600;font-size:14px;color:var(--teal-dark)">Image pasted!</div>`}
        toast("Image pasted — tap Submit to send");
      }
      break;
    }
  }
};
window.confirmCardPay=async()=>{await db.collection("orders").doc(window._PO).update({paymentStatus:"pending_transfer",paymentMethod:"card"});toast("Payment reported — the store will confirm it shortly.")};
window.submitSlip=async()=>{
  const btn=$("submitSlipBtn");
  let b64=window._pastedSlip||null;
  if(!b64){
    const f=$("slipFile")?.files[0];
    if(!f){toast("Please paste or upload your transfer slip first");return}
    if(btn){btn.disabled=true;btn.textContent="Uploading…"}
    b64=await compressImg(f,900,1100,0.65);
  }else{if(btn){btn.disabled=true;btn.textContent="Submitting…"}}
  if(!b64){toast("Could not read image");if(btn){btn.disabled=false;btn.textContent="Submit transfer slip"}return}
  await db.collection("orders").doc(window._PO).update({paymentStatus:"pending_transfer",paymentMethod:"transfer",transferSlip:b64});
  window._pastedSlip=null;
  toast("✅ Slip submitted! The store will confirm your payment shortly.");
};

function renderBizHead(){

      <div class="muted">Plan: <strong>${esc(myBiz.plan||"none")}</strong>${exp?` · ${gone?"expired":"expires"} ${exp.toLocaleDateString("en-GB")}${gone?"":` (${dl} day${dl===1?"":"s"} left)`}`:""}</div></div>

function subBannerHTML(){
  const dl=daysLeft(myBiz);if(dl===null)return "";

  if(dl<=WARN_DAYS)return`<div class="banner banner-amber">⏰ <div><strong>Your plan expires in ${dl} day${dl===1?"":"s"}</strong> (${exp}). Choose a plan to keep your store live.</div><button class="btn btn-p btn-sm" onclick="bizTab('subs')">View plans</button></div>`;

function watchBizDoc(){
  if(bizDocUnsub)bizDocUnsub();
  let first=true;
  bizDocUnsub=db.collection("businesses").doc(myBiz.id).onSnapshot(doc=>{
    if(!doc.exists)return;
    const prev=myBiz;
    myBiz={id:doc.id,...doc.data()};
    if(first){first=false;return}
    if(myBiz.status!==prev.status||isExpired(myBiz)!==window._bizWasExpired){route();return}
    renderBizHead();
    const planChanged=prev.plan!==myBiz.plan||String(toDate(prev.planExpiry))!==String(toDate(myBiz.planExpiry));
    if(planChanged){
      const e=toDate(myBiz.planExpiry);
      toast(`✅ Plan updated: ${myBiz.plan}${e?" until "+e.toLocaleDateString("en-GB"):""}`,5000);
      if(window._bizTab==="subs")bizTab("subs");
    }
  },()=>{});
}
function checkExpiryNotice(){
  const dl=daysLeft(myBiz);if(dl===null||dl>WARN_DAYS)return;
  const key="eb_expwarn_"+myBiz.id,today=todayStr();
  if(localStorage.getItem(key)===today)return;
  localStorage.setItem(key,today);
  const msg=dl<0?"Your subscription has expired — renew to bring your store back online.":`Your plan expires in ${dl} day${dl===1?"":"s"}. Renew to keep your store live.`;
  toast("⏰ "+msg,6000);
  fireNotif("Eazy Grocer subscription",msg);
}

function detectBulkCols(headers){
  const h=headers.map(x=>(x||"").toString().toLowerCase().trim());
  const find=(...keys)=>{const i=h.findIndex(c=>keys.includes(c));return i};
  return{
    name:find("name","product","product name","item","item name","product_name"),
    desc:find("desc","description","details","notes","info"),
    price:find("price","cost","mvr","amount","rate","unit price"),
    unit:find("unit","size","weight","pack","quantity","unit size"),
    sortOrder:find("order","sort","sort order","display order","sortorder","position","sort_order"),
    available:find("available","active","enabled","status","visible","in stock"),
  };
}

window.parseBulkFile=async inp=>{
  const file=inp.files[0];if(!file)return;
  $("blkPrev").innerHTML=`<div class="muted">Reading file…</div>`;
  const ext=file.name.split(".").pop().toLowerCase();
  let rows=[];
  try{
    if(ext==="csv"){
      const text=await file.text();
      rows=text.split(/\r?\n/).filter(l=>l.trim()).map(l=>{
        const res=[],len=l.length;let cur="",inQ=false;
        for(let i=0;i<len;i++){
          const c=l[i];
          if(c==='"'){inQ=!inQ}
          else if(c===","&&!inQ){res.push(cur.trim());cur=""}
          else cur+=c;
        }
        res.push(cur.trim());return res;
      });
    }else if(["xlsx","xls"].includes(ext)){
      if(typeof XLSX==="undefined"){toast("Excel library not loaded yet — try again in a moment");return}
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
    }else{toast("Unsupported format. Please use .xlsx, .xls or .csv");return}
  }catch(e){$("blkPrev").innerHTML=`<p style="color:var(--red)">Could not read file. Is it a valid Excel or CSV?</p>`;return}

  if(!rows.length||rows.length<2){$("blkPrev").innerHTML=`<p style="color:var(--red)">File is empty or has only one row (headers only).</p>`;return}

  const headers=rows[0].map(h=>(h||"").toString());
  const dataRows=rows.slice(1).filter(r=>r.some(c=>c!==null&&c!==""&&c!==undefined));
  const cols=detectBulkCols(headers);

  if(cols.name<0){
    $("blkPrev").innerHTML=`<div style="color:var(--red);padding:12px;background:var(--red-soft);border-radius:8px">
      <strong>No "name" column found.</strong><br><span class="muted">Headers in your file: ${esc(headers.join(", "))}</span><br>
      <span class="muted">Rename your product name column to <strong>name</strong> and try again.</span></div>`;
    return;
  }

  window._blkProds=dataRows.map(row=>{
    const avRaw=(cols.available>=0?(row[cols.available]||"").toString().toLowerCase():"yes");
    const available=!["no","false","0","hidden","inactive"].includes(avRaw);
    return{
      name:(row[cols.name]||"").toString().trim(),
      desc:cols.desc>=0?(row[cols.desc]||"").toString().trim():"",
      price:cols.price>=0?Math.round((parseFloat((row[cols.price]||"").toString().replace(/[^\d.]/g,""))||0)*100)/100:0,
      unit:cols.unit>=0?(row[cols.unit]||"").toString().trim():"",
      sortOrder:cols.sortOrder>=0?parseInt((row[cols.sortOrder]||"").toString())||99:99,
      available,
    };
  }).filter(p=>p.name);

  const prods=window._blkProds;
  if(!prods.length){$("blkPrev").innerHTML=`<p style="color:var(--red)">No valid products found (name column appears empty).</p>`;return}

  const skipped=dataRows.length-prods.length;
  const noPrice=prods.filter(p=>!p.price).length;
  $("blkPrev").innerHTML=`
    <div class="row spread" style="margin-bottom:10px;flex-wrap:wrap;gap:6px">
      <span class="badge b-active" style="font-size:13px">✅ ${prods.length} products ready</span>
      ${skipped?`<span class="badge b-cancelled">${skipped} rows skipped (no name)</span>`:""}
      ${noPrice?`<span class="badge b-pending">⚠️ ${noPrice} items with MVR 0 — set prices after import</span>`:""}
    </div>
    <div style="overflow:auto;border-radius:10px;border:1px solid var(--line);margin-bottom:4px">
      <table style="min-width:480px">
        <thead><tr><th>#</th><th>Name</th><th>Price</th><th>Unit</th><th>Order</th><th>Available</th></tr></thead>
        <tbody>${prods.slice(0,12).map((p,i)=>`<tr>
          <td class="muted">${i+1}</td>
          <td><strong>${esc(p.name)}</strong>${p.desc?`<div class="muted" style="font-size:12px">${esc(p.desc.substring(0,60))}${p.desc.length>60?"…":""}</div>`:""}</td>
          <td class="price">${p.price?mvr(p.price):`<span class="muted">—</span>`}</td>
          <td class="muted">${esc(p.unit)||"—"}</td>
          <td class="muted">${p.sortOrder<99?p.sortOrder:"—"}</td>
          <td><span class="badge ${p.available?"b-active":"b-suspended"}">${p.available?"Yes":"Hidden"}</span></td>
        </tr>`).join("")}
        ${prods.length>12?`<tr><td colspan="6" class="muted" style="text-align:center;padding:10px">… and ${prods.length-12} more products</td></tr>`:""}</tbody>
      </table>
    </div>`;

  const btn=$("blkBtn");
  if(btn){btn.style.display="block";btn.textContent=`Import all ${prods.length} products`}
};

window.doBulkImport=async()=>{
  const prods=window._blkProds||[];
  if(!prods.length){toast("Nothing to import");return}
  const btn=$("blkBtn");if(btn){btn.disabled=true;btn.textContent="Checking duplicates…"}
  const existing=await getExistingProdKeys(myBiz.id);
  const toAdd=prods.filter(p=>{
    const key=p.name.toLowerCase().trim()+"|"+p.price;
    return!existing.has(key);
  });
  const skipped=prods.length-toAdd.length;
  if(!toAdd.length){closeModal();toast("All products already exist — nothing new to add.");return}
  if(btn)btn.textContent=`Importing ${toAdd.length}…`;
  const col=db.collection("businesses").doc(myBiz.id).collection("products");
  const CHUNK=400;
  for(let i=0;i<toAdd.length;i+=CHUNK){
    const batch=db.batch();
    toAdd.slice(i,i+CHUNK).forEach(p=>batch.set(col.doc(),{
      name:p.name,desc:p.desc,price:p.price,unit:p.unit,
      available:p.available&&p.price>0,sortOrder:p.sortOrder,
      imageData:"",imageUrl:"",catalogId:"",createdAt:FV.serverTimestamp()
    }));
    await batch.commit();
    if(btn)btn.textContent=`Importing… ${Math.min(i+CHUNK,toAdd.length)}/${toAdd.length}`;
  }
  closeModal();
  toast(`✅ ${toAdd.length} products imported${skipped?` · ${skipped} skipped (duplicates)`:""}!`);
};

async function genBizReport(){
  const from=new Date($("rFrom").value+"T00:00:00"),to=new Date($("rTo").value+"T23:59:59");
  $("genRep").disabled=true;$("genRep").textContent="Loading…";
  const snap=await db.collection("orders").where("bizId","==",myBiz.id).get();
  const ords=snap.docs.map(d=>({id:d.id,...d.data()})).filter(o=>{
    const d=o.createdAt?.toDate?o.createdAt.toDate():new Date(o.createdAt||0);return d>=from&&d<=to;
  }).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
  $("genRep").disabled=false;$("genRep").textContent="Generate report";
  const revenue=ords.filter(o=>o.status!=="cancelled").reduce((s,o)=>s+o.total,0);
  const collected=ords.filter(o=>o.paymentStatus==="paid").reduce((s,o)=>s+o.total,0);
  $("repOut").innerHTML=`<div class="kpi">${[["Total orders",ords.length],["Delivered",ords.filter(o=>o.status==="delivered").length],["Revenue",mvr(revenue)],["Collected",mvr(collected)]].map(([l,n])=>`<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div>
    <button class="btn btn-p" onclick="dlBizPDF()">⬇️ Download PDF</button>`;
  window._RD={ords,from,to};
}
window.dlBizPDF=()=>{
  const{jsPDF}=window.jspdf;const doc=new jsPDF();
  const{ords,from,to}=window._RD||{ords:[],from:new Date(),to:new Date()};
  doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text("Eazy Grocer — Order Report",14,18);
  doc.setFontSize(11);doc.setFont("helvetica","normal");
  doc.text(`Business: ${myBiz.name||""}`,14,28);
  doc.text(`Period: ${from.toLocaleDateString("en-GB")} – ${to.toLocaleDateString("en-GB")}`,14,35);
  doc.text(`Generated: ${new Date().toLocaleString("en-GB")}`,14,42);
  const rev=ords.filter(o=>o.status!=="cancelled").reduce((s,o)=>s+o.total,0);
  const col=ords.filter(o=>o.paymentStatus==="paid").reduce((s,o)=>s+o.total,0);
  doc.setFont("helvetica","bold");
  doc.text(`Orders: ${ords.length}   Revenue: MVR ${rev.toFixed(2)}   Collected: MVR ${col.toFixed(2)}`,14,52);
  doc.autoTable({startY:58,
    head:[["Code","Date","Customer","Items","Total","Status","Payment"]],
    body:ords.map(o=>[o.code,o.createdAt?.toDate?o.createdAt.toDate().toLocaleDateString("en-GB"):"",`${o.customer?.name||""} ${o.customer?.phone||""}`,o.items.map(i=>`${i.name} ×${i.qty}`).join(", "),"MVR "+Number(o.total||0).toFixed(2),SL[o.status]||o.status,PL[o.paymentStatus||"unpaid"]||""]),
    styles:{fontSize:8,cellPadding:3},headStyles:{fillColor:[14,138,132]},alternateRowStyles:{fillColor:[243,249,248]}
  });
  doc.save(`${myBiz.name||"report"}-${from.toISOString().slice(0,10)}.pdf`);
};

async function genAdminReport(){
  const from=new Date($("arFrom").value+"T00:00:00"),to=new Date($("arTo").value+"T23:59:59");
  $("genAR").disabled=true;$("genAR").textContent="Loading…";
  const[os,bs]=await Promise.all([db.collection("orders").get(),db.collection("businesses").get()]);
  const bmap=Object.fromEntries(bs.docs.map(d=>[d.id,d.data().name]));
  const ords=os.docs.map(d=>({id:d.id,...d.data()})).filter(o=>{
    const d=o.createdAt?.toDate?o.createdAt.toDate():new Date(o.createdAt||0);return d>=from&&d<=to&&o.status!=="cancelled";
  });
  const byBiz={};
  ords.forEach(o=>{if(!byBiz[o.bizId])byBiz[o.bizId]={name:bmap[o.bizId]||o.bizName,orders:0,revenue:0,paid:0};byBiz[o.bizId].orders++;byBiz[o.bizId].revenue+=o.total;if(o.paymentStatus==="paid")byBiz[o.bizId].paid+=o.total});
  const rows=Object.values(byBiz).sort((a,b)=>b.revenue-a.revenue);
  const gRev=rows.reduce((s,r)=>s+r.revenue,0),gPaid=rows.reduce((s,r)=>s+r.paid,0);
  $("genAR").disabled=false;$("genAR").textContent="Generate";
  $("arOut").innerHTML=`<div class="kpi">${[["Orders",ords.length],["Businesses",rows.length],["Total revenue",mvr(gRev)],["Total collected",mvr(gPaid)]].map(([l,n])=>`<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div>
    <div class="card" style="margin-bottom:12px"><table><tr><th>Business</th><th>Orders</th><th>Revenue</th><th>Collected</th></tr>
    ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.orders}</td><td class="price">${mvr(r.revenue)}</td><td class="price">${mvr(r.paid)}</td></tr>`).join("")}</table></div>
    <button class="btn btn-p" onclick="dlAdminPDF()">⬇️ Download PDF</button>`;
  window._ARD={rows,gRev,gPaid,ords,from,to};
}
window.dlAdminPDF=()=>{
  const{jsPDF}=window.jspdf;const doc=new jsPDF();
  const{rows,gRev,gPaid,ords,from,to}=window._ARD||{rows:[],gRev:0,gPaid:0,ords:[],from:new Date(),to:new Date()};
  doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text("Eazy Grocer — Portal Report",14,18);
  doc.setFontSize(11);doc.setFont("helvetica","normal");
  doc.text(`Period: ${from.toLocaleDateString("en-GB")} – ${to.toLocaleDateString("en-GB")}`,14,28);
  doc.text(`Total orders: ${ords.length}  |  Revenue: MVR ${gRev.toFixed(2)}  |  Collected: MVR ${gPaid.toFixed(2)}`,14,36);
  doc.autoTable({startY:44,head:[["Business","Orders","Revenue (MVR)","Collected (MVR)"]],
    body:rows.map(r=>[r.name,r.orders,r.revenue.toFixed(2),r.paid.toFixed(2)]),
    styles:{fontSize:9},headStyles:{fillColor:[14,138,132]}});
  doc.save(`eazy-grocer-portal-${from.toISOString().slice(0,10)}.pdf`);
};

window.seedCatalog=async()=>{
  if(!confirm("This will add "+SEED_CATALOG.length+" grocery products to the catalog with Maldivian market prices. Continue?"))return;
  openModal(`<h2>🌱 Seeding catalog…</h2>
    <p class="muted">Fetching product images from Open Food Facts — one search per category.</p>
    <div id="seedMsg" style="margin-top:14px;font-weight:600">Starting…</div>
    <div style="background:var(--line);border-radius:99px;height:10px;margin-top:8px"><div id="seedBar" style="background:var(--teal);height:10px;border-radius:99px;width:0;transition:.4s"></div></div>
    <div id="seedDetail" class="muted" style="margin-top:8px"></div>`);
  const cats=Object.keys(SEED_QUERIES);
  const catImgs={};
  for(let i=0;i<cats.length;i++){
    const cat=cats[i];
    if(!$("seedMsg"))break;
    $("seedMsg").textContent="Searching: "+cat+"…";
    $("seedBar").style.width=((i+1)/(cats.length+1)*80)+"%";
    try{
      const n=SEED_CATALOG.filter(p=>p.category===cat).length;
      const r=await fetch("https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(SEED_QUERIES[cat])+"&json=1&page_size="+(n*2+5)+"&fields=image_thumb_url");
      const d=await r.json();
      catImgs[cat]=(d.products||[]).filter(p=>p.image_thumb_url).map(p=>p.image_thumb_url);
    }catch{catImgs[cat]=[]}
    await new Promise(r=>setTimeout(r,350));
  }
  if($("seedMsg"))$("seedMsg").textContent="Writing "+SEED_CATALOG.length+" products to catalog…";
  if($("seedBar"))$("seedBar").style.width="90%";
  const catIdx={};
  const batch=db.batch();
  SEED_CATALOG.forEach(item=>{
    if(!catIdx[item.category])catIdx[item.category]=0;
    const imgs=catImgs[item.category]||[];
    const imageUrl=imgs[catIdx[item.category]++]||"";
    batch.set(db.collection("catalog").doc(),{
      name:item.name,brand:item.brand||"",unit:item.unit||"",
      category:item.category,suggestedPrice:item.suggestedPrice||0,
      imageUrl,createdAt:FV.serverTimestamp()
    });
  });
  await batch.commit();
  if($("seedBar"))$("seedBar").style.width="100%";
  if($("seedMsg"))$("seedMsg").textContent="✅ Done! "+SEED_CATALOG.length+" products added.";
  if($("seedDetail"))$("seedDetail").textContent="Businesses can now browse and add these to their stores.";
  setTimeout(()=>{closeModal();loadCatalog();},2500);
};

/* ── copy to clipboard ── */
window.copyText=text=>{
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast("✅ Copied!")).catch(()=>fallbackCopy(text))}
  else fallbackCopy(text);
};
function fallbackCopy(text){
  const el=document.createElement("textarea");el.value=text;el.style.position="fixed";el.style.opacity="0";
  document.body.appendChild(el);el.select();document.execCommand("copy");
  document.body.removeChild(el);toast("✅ Copied!");
}

window.parseAdminBulk=async inp=>{
  const file=inp.files[0];if(!file)return;
  $("adminBlkPrev").innerHTML=`<div class="muted">Reading…</div>`;
  const ext=file.name.split(".").pop().toLowerCase();
  let rows=[];
  try{
    if(ext==="csv"){
      const text=await file.text();
      rows=text.split(/\r?\n/).filter(l=>l.trim()).map(l=>{
        const res=[],len=l.length;let cur="",inQ=false;
        for(let i=0;i<len;i++){const c=l[i];if(c==='"'){inQ=!inQ}else if(c===","&&!inQ){res.push(cur.trim());cur=""}else cur+=c}
        res.push(cur.trim());return res;
      });
    }else{
      if(typeof XLSX==="undefined"){toast("Excel library not ready — try again");return}
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array"});
      rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    }
  }catch{$("adminBlkPrev").innerHTML=`<p style="color:var(--red)">Could not read file.</p>`;return}
  if(rows.length<2){$("adminBlkPrev").innerHTML=`<p style="color:var(--red)">File is empty or has only headers.</p>`;return}
  const headers=rows[0].map(h=>(h||"").toString().toLowerCase().trim());
  const fi=(...k)=>headers.findIndex(h=>k.includes(h));
  const ci={name:fi("name","product","item"),brand:fi("brand"),unit:fi("unit","size","weight"),category:fi("category","cat"),price:fi("price","suggestedprice","suggested price","cost","mvr")};
  if(ci.name<0){$("adminBlkPrev").innerHTML=`<p style="color:var(--red)">No "name" column found. Headers: ${esc(rows[0].join(", "))}</p>`;return}
  window._adminBlkItems=rows.slice(1).filter(r=>r.some(c=>c!=null&&c!=="")).map(row=>({
    name:(row[ci.name]||"").toString().trim(),
    brand:ci.brand>=0?(row[ci.brand]||"").toString().trim():"",
    unit:ci.unit>=0?(row[ci.unit]||"").toString().trim():"",
    category:ci.category>=0?(row[ci.category]||"").toString().trim():"",
    suggestedPrice:ci.price>=0?Math.round(parseFloat((row[ci.price]||"").toString().replace(/[^\d.]/g,""))||0):"",
  })).filter(p=>p.name);
  const items=window._adminBlkItems;
  if(!items.length){$("adminBlkPrev").innerHTML=`<p style="color:var(--red)">No valid rows found.</p>`;return}
  $("adminBlkPrev").innerHTML=`
    <div class="muted" style="margin-bottom:8px"><strong>${items.length}</strong> items found — duplicates will be skipped on import</div>
    <div style="overflow:auto;border-radius:10px;border:1px solid var(--line)">
      <table style="min-width:400px"><thead><tr><th>Name</th><th>Brand</th><th>Unit</th><th>Category</th><th>Price</th></tr></thead>
      <tbody>${items.slice(0,10).map(p=>`<tr>
        <td><strong>${esc(p.name)}</strong></td>
        <td class="muted">${esc(p.brand)||"—"}</td>
        <td class="muted">${esc(p.unit)||"—"}</td>
        <td class="muted">${esc(p.category)||"—"}</td>
        <td class="price">${p.suggestedPrice?mvr(p.suggestedPrice):"—"}</td>
      </tr>`).join("")}
      ${items.length>10?`<tr><td colspan="5" class="muted" style="text-align:center;padding:8px">…and ${items.length-10} more</td></tr>`:""}</tbody></table>
    </div>`;
  const btn=$("adminBlkBtn");if(btn){btn.style.display="block";btn.textContent=`Import ${items.length} items to catalog`}
};
window.doAdminBulkImport=async()=>{
  const items=window._adminBlkItems||[];if(!items.length)return;

/* ─── ADMIN: DEDUP CATALOG ─── */
window.dedupCatalog=async()=>{
  const snap=await db.collection("catalog").get();
  const docs=snap.docs;
  if(!docs.length){toast("Catalog is empty");return}
  const seen={};const toDelete=[];
  docs.forEach(doc=>{
    const name=(doc.data().name||"").toLowerCase().trim();
    if(!seen[name]){
      seen[name]={id:doc.id,hasImg:!!(doc.data().imageUrl),price:doc.data().suggestedPrice||0};
    }else{
      const ex=seen[name];const nd=doc.data();
      const newBetter=(nd.imageUrl&&!ex.hasImg)||(nd.suggestedPrice&&!ex.price);
      if(newBetter){toDelete.push(ex.id);seen[name]={id:doc.id,hasImg:!!(nd.imageUrl),price:nd.suggestedPrice||0}}
      else toDelete.push(doc.id);
    }
  });
  if(!toDelete.length){toast("✅ No duplicates found in catalog!");return}
  if(!confirm(`Found ${toDelete.length} duplicate catalog item${toDelete.length>1?"s":""}. Remove them? Better entries (with images/prices) are kept.`))return;
  const CHUNK=400;
  for(let i=0;i<toDelete.length;i+=CHUNK){
    const batch=db.batch();
    toDelete.slice(i,i+CHUNK).forEach(id=>batch.delete(db.collection("catalog").doc(id)));
    await batch.commit();
  }
  toast(`🗑️ Removed ${toDelete.length} duplicate${toDelete.length>1?"s":""}`);
  loadCatalog();
};

/* =========================================================
   PROMOTIONS — discount codes, sales, lucky draws
   ========================================================= */
function promoLive(p){const t=todayStr();return p.active!==false&&(!p.start||p.start<=t)&&(!p.end||p.end>=t)}
function promoEnded(p){return !!p.end&&p.end<todayStr()}
function promoVisible(p){
  if(promoLive(p))return true;
  if(p.type==="draw"&&p.winnerCode&&p.active!==false)return(Date.now()-new Date((p.end||todayStr())+"T00:00:00"))<14*864e5;
  return false;
}
async function fetchPromos(bizId){
  try{
    const jobs=[db.collection("promotions").where("active","==",true).where("scope","==","portal").get()];
    if(bizId)jobs.push(db.collection("promotions").where("active","==",true).where("bizId","==",bizId).get());
    const res=await Promise.all(jobs);
    return res.flatMap(r=>r.docs.map(d=>({id:d.id,...d.data()}))).filter(promoVisible);
  }catch(e){console.warn("promotions",e);return []}
}
function salePctFor(prod,promos){
  let best=0;
  promos.forEach(p=>{
    if(p.type!=="sale"||!promoLive(p))return;
    const all=!p.productIds||!p.productIds.length;
    if(all||p.productIds.includes(prod.id))best=Math.max(best,Number(p.percent)||0);
  });
  return best;
}

  };

window.runDraw=async id=>{
  const p=window._PRM[id];if(!p)return;
  openModal(`<h2>🎟️ ${esc(p.title)}</h2><div id="drawBody"><div class="empty">Counting entries…</div></div>`);
  try{
    const snap=p.scope==="portal"?await db.collection("orders").get():await db.collection("orders").where("bizId","==",p.bizId).get();
    const from=new Date(p.start+"T00:00:00"),to=p.end?new Date(p.end+"T23:59:59"):new Date(8.64e15);
    const entries=snap.docs.map(d=>({id:d.id,...d.data()})).filter(o=>{
      const d=toDate(o.createdAt);
      return d&&d>=from&&d<=to&&o.paymentStatus==="paid"&&o.status!=="cancelled"&&Number(o.total)>=(p.minOrder||0);
    });
    window._drawEntries=entries;window._drawPick=null;
    $("drawBody").innerHTML=`<p class="muted">Prize: <strong>${esc(p.prize||"")}</strong><br>Qualifying entries (paid orders${p.minOrder?" of "+mvr(p.minOrder)+"+":""} from ${fmtD(p.start)} to ${p.end?fmtD(p.end):"now"}): <strong>${entries.length}</strong></p>

      <div class="row" id="drawBtns"><button class="btn btn-p" style="flex:1" onclick="doDraw('${id}')" ${entries.length?"":"disabled"}>🎲 Draw a winner</button><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>`;
  }catch(e){console.error(e);$("drawBody").innerHTML=`<div class="empty">Could not load entries.</div>`}
};

window.doDraw=id=>{
  const es=window._drawEntries||[];if(!es.length)return;
  const box=$("drawResult"),btns=$("drawBtns");
  btns.innerHTML=`<button class="btn btn-ghost" disabled style="flex:1">Drawing…</button>`;
  let n=0;
  const t=setInterval(()=>{
    box.innerHTML=`<div class="draw-spin">${esc(es[Math.floor(Math.random()*es.length)].code)}</div>`;
    if(++n>=16){
      clearInterval(t);

      window._drawPick=w;
      box.innerHTML=winnerHTML(w);
      btns.innerHTML=`<button class="btn btn-p" style="flex:1" onclick="confirmWinner('${id}')">✅ Confirm winner</button><button class="btn btn-o" onclick="doDraw('${id}')">🔄 Draw again</button>`;

async function setSlip(key,file){
  const b64=await compressImg(file,900,1100,0.65);
  if(!b64){toast("Could not read that image");return}
  window._slips[key]=b64;
  const img=$("sp_"+key);if(img){img.src=b64;img.style.display="block"}
  const z=$("pz_"+key);if(z){z.classList.add("ok");z.innerHTML=`<div style="font-size:22px">✅</div><div style="font-weight:600;font-size:14px;color:var(--teal-dark)">Slip attached</div>`}

  const key=window._activeSlip;if(!key||!$("pz_"+key))return;
  for(const it of (e.clipboardData&&e.clipboardData.items)||[]){
    if(it.type.startsWith("image/")){e.preventDefault();setSlip(key,it.getAsFile());break}
  }
});

    $("reqHist").innerHTML=reqs.length?`<table><tr><th>Date</th><th>Plan</th><th>Amount</th><th>Status</th></tr>
      ${reqs.map(r=>`<tr><td>${fmtDate(r.createdAt)}</td><td>${esc(r.planName)}</td><td class="price">${mvr(r.price)}</td>
        <td><span class="badge ${r.status==="approved"?"b-active":r.status==="rejected"?"b-cancelled":"b-pending"}">${r.status}</span>${r.status==="rejected"&&r.rejectReason?`<div class="muted">${esc(r.rejectReason)}</div>`:""}</td></tr>`).join("")}</table>`
      :`<div class="empty" style="padding:20px">No requests yet.</div>`;
  },()=>{const h=$("reqHist");if(h)h.innerHTML=`<div class="empty">Could not load requests.</div>`});
  unsub.push(u);
}
window.choosePlan=i=>{
  const{plans,cfg}=window._planCfg,p=plans[i];if(!p)return;
  const hasBank=!!(cfg.bankName||cfg.accountNumber);
  openModal(`<h2>Pay for ${esc(p.name)}</h2>
    <div class="muted">${mvr(p.price)} / ${p.period==="yr"?"year":"month"}</div>
    ${hasBank?`<div style="background:var(--teal-soft);border:2px solid var(--teal);border-radius:12px;padding:14px;margin:12px 0">
      <div style="font-weight:700;color:var(--teal-dark);margin-bottom:8px">🏦 Transfer to</div>
      ${cfg.bankName?`<div class="row spread" style="padding:3px 0"><span class="muted">Bank</span><strong>${esc(cfg.bankName)}</strong></div>`:""}
      ${cfg.accountNumber?`<div class="row spread" style="padding:3px 0"><span class="muted">Account no.</span><div class="row" style="gap:6px"><strong style="font-family:monospace;font-size:15px">${esc(cfg.accountNumber)}</strong><button class="copy-mini" onclick="copyText('${esc(cfg.accountNumber)}')">📋</button></div></div>`:""}
      ${cfg.accountName?`<div class="row spread" style="padding:3px 0"><span class="muted">Account name</span><strong>${esc(cfg.accountName)}</strong></div>`:""}
      <div class="row spread" style="padding:4px 0;border-top:1px solid var(--teal);margin-top:8px"><span class="muted">Amount</span><strong class="price" style="font-size:17px">${mvr(p.price)}</strong></div>
      <div class="muted" style="margin-top:4px;font-size:12px">Please use your business name as the transfer reference.</div>
    </div>`:`<p style="color:var(--red);margin:12px 0">Payment details haven't been set up yet. Please contact ${esc(cfg.contact||"the portal admin")}.</p>`}
    ${slipWidget("plan")}
    <button class="btn btn-p" style="width:100%;margin-top:14px" id="planSubmit" ${hasBank?"":"disabled"}>Submit payment for approval</button>`);
  $("planSubmit").onclick=async()=>{
    const slip=window._slips.plan;
    if(!slip){toast("Attach your transfer slip first");return}
    const btn=$("planSubmit");btn.disabled=true;btn.textContent="Submitting…";
    try{
      await db.collection("subscriptionRequests").add({bizId:myBiz.id,bizName:myBiz.name,ownerUid:user.uid,ownerEmail:user.email,planName:p.name,price:Number(p.price)||0,period:p.period||"mo",slip,status:"pending",createdAt:FV.serverTimestamp()});
      closeModal();toast("✅ Request sent — the admin will review your payment");
    }catch(e){console.error(e);toast("Could not submit. Please try again.");btn.disabled=false;btn.textContent="Submit payment for approval"}
  };
};

/* =========================================================
   ADMIN: SUBSCRIPTION REQUESTS
   ========================================================= */
function watchSubRequests(){
  if(adminWatch)adminWatch();
  let first=true;
  adminWatch=db.collection("subscriptionRequests").where("status","==","pending").onSnapshot(snap=>{
    const b=$("atSubs");if(b)b.textContent="Subscriptions"+(snap.size?` (${snap.size})`:"");
    if(!first&&snap.docChanges().some(c=>c.type==="added"))toast("💳 New subscription request");
    first=false;
  },()=>{});
}
function adminSubs(){
  $("adminBody").innerHTML=`<div class="tabs" id="reqTabs"></div><div class="grid grid-2" id="reqList"><div class="empty">Loading…</div></div>`;
  let filter="pending",all=[];
  const render=()=>{
    const tabs=$("reqTabs");if(!tabs)return;
    const cnt=s=>all.filter(r=>r.status===s).length;
    tabs.innerHTML=["pending","approved","rejected","all"].map(f=>`<button class="tab ${filter===f?"active":""}" onclick="_reqFilter('${f}')">${f[0].toUpperCase()+f.slice(1)}${f!=="all"?` (${cnt(f)})`:""}</button>`).join("");
    window._REQS=Object.fromEntries(all.map(r=>[r.id,r]));
    const list=all.filter(r=>filter==="all"||r.status===filter);
    $("reqList").innerHTML=list.length?list.map(r=>`<div class="card">
      <div class="row spread"><strong>${esc(r.bizName)}</strong><span class="badge ${r.status==="approved"?"b-active":r.status==="rejected"?"b-cancelled":"b-pending"}">${r.status}</span></div>
      <div class="muted">${esc(r.ownerEmail||"")} · ${fmtDate(r.createdAt)}</div>
      <div style="margin:8px 0"><strong>${esc(r.planName)}</strong> · <span class="price">${mvr(r.price)}</span> / ${r.period==="yr"?"year":"month"}</div>
      ${r.slip?`<img src="${r.slip}" onclick="viewReqSlip('${r.id}')" style="max-width:100%;max-height:120px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block">
        <button class="btn btn-o btn-sm" style="margin-top:6px" onclick="viewReqSlip('${r.id}')">🔍 View / download slip</button>`:""}
      ${r.status==="pending"?`<div class="row" style="margin-top:10px"><button class="btn btn-p btn-sm" onclick="approveReq('${r.id}')">✅ Approve</button><button class="btn btn-danger btn-sm" onclick="rejectReq('${r.id}')">✖ Reject</button></div>`:""}
      ${r.status==="approved"&&r.newExpiry?`<div class="muted" style="margin-top:6px">Active until ${toDate(r.newExpiry).toLocaleDateString("en-GB")}</div>`:""}
      ${r.status==="rejected"&&r.rejectReason?`<div class="muted" style="margin-top:6px">Reason: ${esc(r.rejectReason)}</div>`:""}
    </div>`).join(""):`<div class="empty" style="grid-column:1/-1">No ${filter==="all"?"":filter+" "}requests.</div>`;
  };
  window._reqFilter=f=>{filter=f;render()};
  const u=db.collection("subscriptionRequests").onSnapshot(snap=>{
    all=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    render();
  },()=>{const l=$("reqList");if(l)l.innerHTML=`<div class="empty">Could not load requests.</div>`});
  unsub.push(u);
}
window.viewReqSlip=id=>{
  const r=window._REQS[id];if(!r||!r.slip)return;
  showImg(r.slip,"Payment slip",`${esc(r.bizName)} · ${esc(r.planName)} · ${mvr(r.price)}`,`slip-${(r.bizName||"plan").replace(/\W+/g,"-")}.jpg`,
    r.status==="pending"?`<button class="btn btn-p btn-sm" onclick="approveReq('${id}')">✅ Approve</button>`:"");
};
window.approveReq=async id=>{
  const r=window._REQS[id];if(!r||r.status!=="pending")return;
  if(!confirm(`Approve ${r.planName} for ${r.bizName}?`))return;
  try{
    const bref=db.collection("businesses").doc(r.bizId);
    const bs=await bref.get();
    const cur=toDate(bs.data()&&bs.data().planExpiry);
    const exp=addPeriod(cur&&cur>new Date()?cur:new Date(),r.period);
    const batch=db.batch();
    batch.update(bref,{plan:r.planName,planExpiry:exp});
    batch.update(db.collection("subscriptionRequests").doc(id),{status:"approved",reviewedAt:FV.serverTimestamp(),reviewedBy:user.email,newExpiry:exp});
    await batch.commit();
    closeModal();toast(`✅ ${r.bizName} is now on ${r.planName}`);
  }catch(e){console.error(e);toast("Could not approve — please try again")}
};
window.rejectReq=id=>{
  openModal(`<h2>Reject request</h2><p class="muted">The business will see this reason.</p>
    <label>Reason</label><textarea id="rejReason" rows="3" placeholder="e.g. Transfer amount doesn't match · Slip is unreadable"></textarea>
    <div class="row" style="margin-top:14px"><button class="btn btn-danger" style="flex:1" id="rejBtn">Reject request</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>`);
  $("rejBtn").onclick=async()=>{
    const reason=($("rejReason").value||"").trim();
    if(!reason){toast("Please enter a reason");return}
    try{
      await db.collection("subscriptionRequests").doc(id).update({status:"rejected",rejectReason:reason,reviewedAt:FV.serverTimestamp(),reviewedBy:user.email});
      closeModal();toast("Request rejected");
    }catch(e){toast("Could not reject — please try again")}
  };
};

/* =========================================================
   ADMIN: PLANS & PAYMENT DETAILS, OWNER-EMAIL PRIVACY
   ========================================================= */
async function adminPlans(){
  let data={};
  try{const d=await db.collection("config").doc("plans").get();data=d.exists?d.data():{}}catch(e){}
  $("adminBody").innerHTML=`<div class="card" style="max-width:620px">
    <h3>Subscription plans</h3>
    <p class="muted">New businesses get ${TRIAL_DAYS} days free automatically. These are the paid plans they can request.</p>
    <div id="planRows"></div>
    <button class="btn btn-o btn-sm" style="margin-top:8px" id="addPlanBtn">+ Add plan</button>
    <hr style="border:none;border-top:1px solid var(--line);margin:18px 0">
    <h3>Where businesses pay you</h3>
    <label>Bank name</label><input id="cfgBank" value="${esc(data.bankName||"")}">
    <label>Account number</label><input id="cfgAcc" value="${esc(data.accountNumber||"")}">
    <label>Account name</label><input id="cfgAccName" value="${esc(data.accountName||"")}">
    <label>Support contact shown to businesses</label><input id="cfgContact" value="${esc(data.contact||"")}">
    <button class="btn btn-p" style="margin-top:16px" id="savePlansBtn">Save settings</button>
  </div>`;
  let list=JSON.parse(JSON.stringify(data.list&&data.list.length?data.list:DEFAULT_PLANS));
  function render(){
    $("planRows").innerHTML=list.map((p,i)=>`<div style="border:1.5px solid var(--line);border-radius:10px;padding:10px;margin:8px 0">
      <div class="row" style="flex-wrap:nowrap">
        <input value="${esc(p.name)}" data-f="name" data-i="${i}" placeholder="Plan name" style="flex:2">
        <input value="${p.price}" data-f="price" data-i="${i}" type="number" placeholder="MVR" style="flex:1">
        <select data-f="period" data-i="${i}" style="flex:1"><option ${p.period!=="yr"?"selected":""} value="mo">monthly</option><option ${p.period==="yr"?"selected":""} value="yr">yearly</option></select>
        <button class="btn btn-danger btn-sm" onclick="_dp(${i})">✕</button></div>
      <input value="${esc(p.desc||"")}" data-f="desc" data-i="${i}" placeholder="Short description shown to businesses" style="margin-top:6px"></div>`).join("");
    $("planRows").querySelectorAll("input,select").forEach(el=>{el.oninput=el.onchange=()=>{list[+el.dataset.i][el.dataset.f]=el.dataset.f==="price"?Number(el.value):el.value}});
  }
  window._dp=i=>{list.splice(i,1);render()};
  $("addPlanBtn").onclick=()=>{list.push({name:"",price:0,period:"mo",desc:""});render()};
  $("savePlansBtn").onclick=async()=>{
    await db.collection("config").doc("plans").set({
      list:list.filter(p=>p.name),
      bankName:$("cfgBank").value.trim(),accountNumber:$("cfgAcc").value.trim(),accountName:$("cfgAccName").value.trim(),
      contact:$("cfgContact").value.trim()
    },{merge:true});
    toast("Settings saved");
  };
  render();
}
window.secureOwnerEmails=async()=>{
  if(!confirm("Move every business owner's email out of the public business records into a private record that only you can read?"))return;
  const snap=await db.collection("businesses").get();
  let n=0;
  for(const d of snap.docs){
    const b=d.data();if(!b.ownerEmail)continue;
    await db.collection("bizPrivate").doc(d.id).set({ownerEmail:b.ownerEmail,ownerUid:b.ownerUid||null},{merge:true});
    await d.ref.update({ownerEmail:FV.delete()});
    n++;
  }
  toast(n?`🔒 Secured ${n} business record${n>1?"s":""}`:"Nothing to secure — already done");
};

/* combined status badge HTML used on both customer & business sides */
function statusBadges(o){
  const s=o.status,p=o.paymentStatus||"unpaid";
  // Accepted but unpaid — merge into one clear label
  if(s==="accepted"&&p==="unpaid")
    return`<span class="badge b-unpaid">Accepted · Waiting for payment</span>`;
  if(s==="accepted"&&p==="pending_transfer")
    return`<span class="badge b-pending_transfer">Accepted · Payment submitted</span>`;
  // For all other states show order status + payment badge separately
  let html=`<span class="badge b-${s}">${SL[s]}</span>`;
  if(p==="paid") html+=`<br><span class="badge b-paid" style="margin-top:4px">✅ Paid</span>`;
  else if(p==="pending_transfer") html+=`<br><span class="badge b-pending_transfer" style="margin-top:4px">Payment submitted</span>`;
  else if(p==="refund_requested") html+=`<br><span class="badge b-refund_requested" style="margin-top:4px">Refund requested</span>`;
  else if(p==="refunded") html+=`<br><span class="badge b-refunded" style="margin-top:4px">Refunded</span>`;
  return html;
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kleio Easy Grocer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D;--ink-soft:#4A5573;--line:#E4E7F0;--bg:#F7F9FB;--card:#FFFFFF;
  --teal:#0E8A84;--teal-dark:#0A6560;--teal-soft:#E3F3F2;
  --mango:#F4A300;--mango-soft:#FDF1D9;
  --red:#D64545;--red-soft:#FBE7E7;--green:#2E9E5B;--green-soft:#E4F5EB;
  --purple:#5A46C7;--purple-soft:#EAE6FB;--blue:#1D6FB8;--blue-soft:#E0EEFB;
  --r:14px;--shadow:0 2px 10px rgba(20,33,61,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3,.brand{font-family:'Sora',sans-serif}
a{color:var(--teal);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:12px 0 5px}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:10px 18px;border-radius:10px;border:none;font-weight:600;font-size:14px;transition:.15s}
.btn-p{background:var(--teal);color:#fff}.btn-p:hover{background:var(--teal-dark)}
.btn-o{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.btn-ghost{background:transparent;color:var(--ink-soft)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.hwrap{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px}
.brand{font-weight:800;font-size:19px;color:var(--ink)}.brand b{color:var(--teal)}
nav{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
nav a{padding:7px 12px;border-radius:8px;color:var(--ink-soft);font-weight:600;font-size:14px}
nav a.active,nav a:hover{background:var(--teal-soft);color:var(--teal-dark)}
.cartbtn{position:relative}
.cartbadge{position:absolute;top:-4px;right:-4px;background:var(--mango);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 6px}

main{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:16px}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.muted{color:var(--ink-soft);font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.b-new{background:var(--mango-soft);color:#9a6a00}
.b-accepted{background:var(--teal-soft);color:var(--teal-dark)}
.b-preparing{background:var(--purple-soft);color:var(--purple)}
.b-out_for_delivery{background:var(--blue-soft);color:var(--blue)}
.b-delivered{background:var(--green-soft);color:var(--green)}
.b-cancelled{background:var(--red-soft);color:var(--red)}
.b-active,.b-paid{background:var(--green-soft);color:var(--green)}
.b-pending,.b-unpaid,.b-pending_transfer{background:var(--mango-soft);color:#9a6a00}
.b-suspended{background:var(--red-soft);color:var(--red)}
.b-refund_requested{background:var(--purple-soft);color:var(--purple)}
.b-refunded{background:var(--blue-soft);color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:8px 10px;border-bottom:1.5px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--ink-soft)}
.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}

.hero{padding:34px 0 26px}
.hero h1{font-size:clamp(26px,4.5vw,40px);font-weight:800;letter-spacing:-.02em}
.hero h1 span{color:var(--teal)}
.hero p{color:var(--ink-soft);margin-top:8px;max-width:520px}
.wave{height:5px;width:120px;margin-top:14px;border-radius:99px;background:repeating-linear-gradient(90deg,var(--teal) 0 14px,var(--mango) 14px 20px)}

.store{cursor:pointer;transition:.15s;overflow:hidden}
.store:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(20,33,61,.1)}
.store .cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mango)}
.store h3{margin:4px 0 6px;font-size:17px}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--teal-soft);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Sora';font-size:18px;margin-bottom:10px}
.store-banner{width:100%;height:110px;object-fit:cover;border-radius:10px;margin-bottom:10px}
.prod-img{width:58px;height:58px;object-fit:cover;border-radius:8px;flex-shrink:0}
.prod{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.prod:last-child{border:none}
.price{font-weight:700;color:var(--teal-dark);white-space:nowrap}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:700;flex-shrink:0}

.modal-bg{position:fixed;inset:0;background:rgba(20,33,61,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px 16px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:24px}
.modal h2{font-size:19px;margin-bottom:6px}

.tl{margin:16px 0;padding-left:4px}
.tl-step{display:flex;gap:12px;padding-bottom:18px;position:relative}
.tl-step:before{content:'';position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl-step:last-child:before{display:none}
.dot{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);background:#fff;flex-shrink:0;z-index:1}
.tl-step.done .dot{background:var(--teal);border-color:var(--teal)}
.tl-step.done:before{background:var(--teal)}

.pay-opt{border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.15s;margin-bottom:10px}
.pay-opt:hover,.pay-opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.pay-opt h4{margin-bottom:3px}

.addr-wrap{position:relative}
.addr-sug{position:absolute;top:calc(100% + 2px);left:0;right:0;background:#fff;border:1.5px solid var(--teal);border-radius:10px;z-index:10;max-height:160px;overflow:auto}
.addr-sug div{padding:9px 12px;cursor:pointer;font-size:14px}
.addr-sug div:hover{background:var(--teal-soft)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;font-size:14px;z-index:200;display:none;white-space:nowrap;max-width:90vw}
.empty{text-align:center;padding:48px 20px;color:var(--ink-soft)}
.empty .big{font-size:34px;margin-bottom:8px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.kpi .card{padding:14px}
.kpi .n{font-family:'Sora';font-weight:800;font-size:22px}
.kpi .l{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:2px}
.hidden{display:none!important}
.notif-btn{background:var(--mango-soft);color:#9a6a00;border:none;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.slip-img{max-width:100%;max-height:180px;border-radius:8px;border:1px solid var(--line);display:block;margin-top:6px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.cat-card{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;transition:.15s;position:relative}
.cat-card.selectable{cursor:pointer}.cat-card.selected{border-color:var(--teal);background:var(--teal-soft)}
.cat-card img{display:block;margin:0 auto 8px;width:70px;height:70px;object-fit:contain}
.cat-card .iname{font-size:13px;font-weight:600;line-height:1.3}
.sel-check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;display:none;align-items:center;justify-content:center}
.cat-card.selected .sel-check{display:flex}
.btn-wa{background:#25D366;color:#fff;border:none}.btn-wa:hover{background:#1da851}
.btn-viber{background:#7360F2;color:#fff;border:none}.btn-viber:hover{background:#5a47d4}
.price-warn{color:var(--mango);font-size:12px;font-weight:600}
@media(max-width:640px){.hwrap{padding:10px 14px}main{padding:16px 14px 70px}.grid-3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <a class="brand" href="#/"><span style="color:var(--teal)">Kleio</span> Easy Grocer</a>
    <nav id="nav">
      <a href="#/" data-r="home">Stores</a>
      <a href="#/orders" data-r="orders">My orders</a>
      <a href="#/track" data-r="track">Track</a>
      <a href="#/biz" data-r="biz">For businesses</a>
      <a href="#/admin" data-r="admin" id="adminLink" class="hidden">Admin</a>
      <a href="#" id="cartLink" class="cartbtn">🛒<span class="cartbadge hidden" id="cartCount">0</span></a>
    </nav>
  </div>
</header>
<main id="app"></main>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.6.0/jspdf.plugin.autotable.min.js"></script>
<script>
/* ===== CONFIG — paste your Firebase project details here ===== */
const firebaseConfig={
  apiKey:"AIzaSyCCWOuycDkcsmwFu7DIrPR1PFRf23oZwk8",
  authDomain:"bizz-eazy.firebaseapp.com",
  projectId:"bizz-eazy",
  storageBucket:"bizz-eazy.firebasestorage.app",
  messagingSenderId:"1090705757043",
  appId:"1:1090705757043:web:7fc3e8e835796559246b06",
  measurementId:"G-6YBCHRG8F1"
};
const ADMIN_EMAILS=["vaddever@gmail.com"];
/* ============================================================= */

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
const FV=firebase.firestore.FieldValue;

const CATS=["Food & Café","Grocery","Bakery","Fashion","Electronics","Services","Other"];
const FLOW=["new","accepted","preparing","out_for_delivery","delivered"];
const SL={new:"New",accepted:"Accepted",preparing:"Preparing",out_for_delivery:"Out for delivery",delivered:"Delivered",cancelled:"Cancelled"};
const PL={unpaid:"Unpaid",pending_transfer:"Slip submitted",paid:"Paid",refund_requested:"Refund requested",refunded:"Refunded"};

let user=null,myBiz=null,isAdmin=false,notifUnsub=null;
let unsub=[];

/* ── helpers ── */
const $=id=>document.getElementById(id);
const app=$("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mvr=n=>"MVR "+Number(n||0).toFixed(2);
const fmtDate=ts=>{const d=ts?.toDate?ts.toDate():(ts?new Date(ts):null);return d?d.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—"};
function toast(m,ms=2800){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",ms)}
function openModal(html){$("modalBox").innerHTML=html;$("modalBg").classList.add("open")}
function closeModal(){$("modalBg").classList.remove("open")}
$("modalBg").onclick=e=>{if(e.target.id==="modalBg")closeModal()};

/* ── local storage ── */
let cart=JSON.parse(localStorage.getItem("eb_cart")||"{}");
function saveCart(){localStorage.setItem("eb_cart",JSON.stringify(cart));updateBadge()}
function cartCount(){let n=0;for(const b in cart)for(const p in cart[b].items)n+=cart[b].items[p].qty;return n}
function updateBadge(){const n=cartCount(),el=$("cartCount");if(el){el.textContent=n;el.classList.toggle("hidden",!n)}}
function getAddrs(){return JSON.parse(localStorage.getItem("eb_addrs")||"[]")}
function saveAddr(a){if(!a)return;const l=getAddrs().filter(x=>x!==a);l.unshift(a);localStorage.setItem("eb_addrs",JSON.stringify(l.slice(0,8)))}
function getMyOrders(){return JSON.parse(localStorage.getItem("eb_myorders")||"[]")}
function saveMyOrder(o){const l=getMyOrders().filter(x=>x.code!==o.code);l.unshift(o);localStorage.setItem("eb_myorders",JSON.stringify(l.slice(0,30)))}
function orderCode(){const c="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let s="KEG-";for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s}

/* ── image compression ── */
function compressImg(file,mw=500,mh=500,q=0.75){
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>mw){h=h*(mw/w);w=mw}if(h>mh){w=w*(mh/h);h=mh}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",q));
    };img.onerror=()=>res(null);img.src=url;
  });
}

/* ── auth ── */
auth.onAuthStateChanged(async u=>{
  user=u;isAdmin=!!u&&ADMIN_EMAILS.includes(u.email);
  $("adminLink").classList.toggle("hidden",!isAdmin);
  myBiz=null;
  if(u&&!isAdmin){
    const s=await db.collection("businesses").where("ownerUid","==",u.uid).limit(1).get();
    if(!s.empty)myBiz={id:s.docs[0].id,...s.docs[0].data()};
  }
  route();
});

/* ── router ── */
window.addEventListener("hashchange",route);
function route(){
  clearUnsubs();
  const h=location.hash||"#/";
  document.querySelectorAll("nav a[data-r]").forEach(a=>a.classList.remove("active"));
  if(h==="#/"){mark("home");vHome()}
  else if(h.startsWith("#/store/")){mark("home");vStore(h.split("/")[2])}
  else if(h==="#/orders"){mark("orders");vMyOrders()}
  else if(h.startsWith("#/track")){mark("track");vTrack(h.split("/")[2]||"")}
  else if(h==="#/biz"){mark("biz");vBiz()}
  else if(h==="#/admin"){mark("admin");vAdmin()}
  else vHome();
  updateBadge();
}
function mark(r){const a=document.querySelector(`nav a[data-r="${r}"]`);a&&a.classList.add("active")}
function clearUnsubs(){unsub.forEach(u=>u&&u());unsub=[]}

/* ── notifications ── */
async function askNotif(){
  if(!("Notification" in window))return false;
  if(Notification.permission==="granted")return true;
  return(await Notification.requestPermission())==="granted";
}
function fireNotif(title,body){if(Notification.permission==="granted")new Notification(title,{body})}
function startNotifWatch(bizId){
  if(notifUnsub)notifUnsub();let first=true;
  notifUnsub=db.collection("orders").where("bizId","==",bizId).where("status","==","new")
    .onSnapshot(snap=>{
      if(first){first=false;return}
      snap.docChanges().filter(c=>c.type==="added").forEach(c=>{
        const o=c.doc.data();
        fireNotif("🛍️ New order!",`${o.code} — ${o.customer?.name||""} — ${mvr(o.total)}`);
        toast("🔔 New order: "+o.code,4000);
      });
    });
}

/* =========================================================
   CUSTOMER: HOME
   ========================================================= */
async function vHome(){
  app.innerHTML=`
    <div class="hero">
      <h1>Your local grocery, <span>delivered eazy</span>.</h1>
      <p>Browse stores across the Maldives, order fresh groceries in minutes, and track right to your door.</p>
      <div class="wave"></div>
    </div>
    <div class="tabs" id="catTabs"></div>
    <div class="grid grid-3" id="storeGrid"><div class="empty">Loading stores…</div></div>`;
  let activeCat="All";
  const tabs=$("catTabs");
  ["All",...CATS].forEach(c=>{
    const b=document.createElement("button");b.className="tab"+(c==="All"?" active":"");b.textContent=c;
    b.onclick=()=>{activeCat=c;tabs.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));b.classList.add("active");render()};
    tabs.appendChild(b);
  });
  let stores=[];
  try{const s=await db.collection("businesses").where("status","==","active").get();stores=s.docs.map(d=>({id:d.id,...d.data()}))}
  catch{$("storeGrid").innerHTML=`<div class="empty">Could not load stores.</div>`;return}
  function isOpen(biz){
    if(!biz.openTime||!biz.closeTime)return null;
    const now=new Date(),cur=now.getHours()*60+now.getMinutes();
    const[oh,om]=biz.openTime.split(":").map(Number),[ch,cm]=biz.closeTime.split(":").map(Number);
    return cur>=oh*60+om&&cur<=ch*60+cm;
  }
  function render(){
    const list=stores.filter(s=>activeCat==="All"||s.category===activeCat);
    $("storeGrid").innerHTML=list.length?list.map(s=>{
      const open=isOpen(s);
      return`<div class="card store" onclick="location.hash='#/store/${s.id}'">
        ${s.logoImg?`<img class="store-banner" src="${s.logoImg}" alt="">`:`<div class="avatar">${esc((s.name||"?")[0].toUpperCase())}</div>`}
        <div class="cat">${esc(s.category||"Store")}</div>
        <h3>${esc(s.name)}</h3>
        <div class="muted">${esc(s.tagline||s.island||"")}</div>
        ${open!==null?`<div class="muted" style="margin-top:4px">${open?'🟢 Open':'🔴 Closed'} · ${esc(s.openTime)}–${esc(s.closeTime)}</div>`:""}</div>`
    }).join(""):`<div class="empty"><div class="big">🏝️</div>No stores here yet.</div>`;
  }
  render();
}

/* =========================================================
   CUSTOMER: STORE
   ========================================================= */
async function vStore(bizId){
  app.innerHTML=`<div class="empty">Loading store…</div>`;
  const doc=await db.collection("businesses").doc(bizId).get();
  if(!doc.exists||doc.data().status!=="active"){app.innerHTML=`<div class="empty">This store is not available.</div>`;return}
  const biz={id:doc.id,...doc.data()};
  const prods=(await db.collection("businesses").doc(bizId).collection("products").where("available","==",true).get()).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.sortOrder||99)-(b.sortOrder||99)||a.name.localeCompare(b.name));
  app.innerHTML=`
    <a href="#/" class="muted">← All stores</a>
    <div class="row spread" style="margin:14px 0 20px">
      <div class="row">
        ${biz.logoImg?`<img src="${biz.logoImg}" style="width:50px;height:50px;border-radius:12px;object-fit:cover">`:`<div class="avatar" style="margin:0">${esc(biz.name[0].toUpperCase())}</div>`}
        <div><h2>${esc(biz.name)}</h2>
          <div class="muted">${esc(biz.category||"")}${biz.island?" · "+esc(biz.island):""}${biz.phone?" · "+esc(biz.phone):""}</div>
          ${biz.openTime?`<div class="muted">Hours: ${esc(biz.openTime)} – ${esc(biz.closeTime)}</div>`:""}
        </div>
      </div>
      <div class="row">
        <button class="btn btn-o btn-sm" onclick="shareStore('${location.origin+location.pathname}#/store/${biz.id}','${esc(biz.name)}')">📤 Share</button>
        <button class="btn btn-p" onclick="showCart()">🛒 View cart</button>
      </div>
    </div>
    <div class="card" id="prodList">
      ${prods.length?prods.map(p=>`
        <div class="prod">
          ${(p.imageUrl||p.imageData)?`<img class="prod-img" src="${p.imageUrl||p.imageData}" alt="">`:``}
          <div style="flex:1"><strong>${esc(p.name)}</strong><div class="muted">${esc(p.desc||"")}</div><div class="price" style="margin-top:4px">${mvr(p.price)}</div></div>
          <div class="qty">
            <button onclick="chQty('${biz.id}','${p.id}',-1)">−</button>
            <span id="q_${p.id}">${cart[biz.id]?.items[p.id]?.qty||0}</span>
            <button onclick="chQty('${biz.id}','${p.id}',1)">+</button>
          </div>
        </div>`).join(""):`<div class="empty">No products listed yet.</div>`}
    </div>`;
  window._SP=Object.fromEntries(prods.map(p=>[p.id,p]));
  window._SB=biz;
  // cache wa number in cart for quick access
  if(cart[bizId])cart[bizId].waNumber=biz.whatsappNumber||'';
  saveCart();
}
window.chQty=(bid,pid,d)=>{
  const p=window._SP[pid],biz=window._SB;
  if(!cart[bid])cart[bid]={bizName:biz.name,items:{}};
  const it=cart[bid].items[pid]||{name:p.name,price:p.price,qty:0};
  it.qty=Math.max(0,it.qty+d);
  if(!it.qty)delete cart[bid].items[pid];else cart[bid].items[pid]=it;
  if(!Object.keys(cart[bid].items).length)delete cart[bid];
  const el=$("q_"+pid);if(el)el.textContent=it.qty;
  saveCart();
};

window.checkout=(bizId)=>{

  openModal(`<h2>Checkout</h2><div class="muted" style="margin-bottom:8px">${esc(c.bizName)}</div>
    <label>Your name</label><input id="cName">

    </div>
    <label>Note (optional)</label><input id="cNote">
    <button class="btn btn-p" style="width:100%;margin-top:16px" id="placeBtn">Place order</button>`);
  $("placeBtn").onclick=async()=>{
    const name=$("cName").value.trim(),phone=$("cPhone").value.trim(),addr=$("cAddr").value.trim();

    const total=items.reduce((s,i)=>s+i.price*i.qty,0);
    const code=orderCode();
    try{
      await db.collection("orders").add({
        code,bizId,bizName:c.bizName,

        items,total,status:"new",paymentStatus:"unpaid",

      saveMyOrder({code,bizName:c.bizName,total,date:new Date().toISOString(),status:"new"});
      delete cart[bizId];saveCart();closeModal();

window.filterAddrs=v=>{const s=$("addrSug");if(!s)return;const lower=v.toLowerCase();s.querySelectorAll("div").forEach(d=>d.style.display=d.textContent.toLowerCase().includes(lower)?"":"none")};

window.doTrack=()=>{const v=$("tCode").value.trim().toUpperCase();if(v)location.hash="#/track/"+v};

function trackLive(code){
  const box=$("tRes");box.innerHTML=`<div class="empty">Searching…</div>`;
  const u=db.collection("orders").where("code","==",code).limit(1).onSnapshot(snap=>{
    if(snap.empty){box.innerHTML=`<div class="empty"><div class="big">🔍</div>Order <strong>${esc(code)}</strong> not found.</div>`;return}
    const oid=snap.docs[0].id,o=snap.docs[0].data();
    const idx=o.status==="cancelled"?-1:FLOW.indexOf(o.status);
    const isPaid=o.paymentStatus==="paid";
    const canPay=o.status==="accepted"&&(o.paymentStatus==="unpaid");
    const slipPending=o.status==="accepted"&&o.paymentStatus==="pending_transfer";
    // sync local status
    const llist=getMyOrders(),lf=llist.find(x=>x.code===code);
    if(lf){lf.status=o.status;localStorage.setItem("eb_myorders",JSON.stringify(llist))}
    box.innerHTML=`<div class="card" style="max-width:560px">
      <div class="row spread">
        <div><strong style="font-size:16px">${esc(o.code)}</strong><div class="muted">${esc(o.bizName)} · ${fmtDate(o.createdAt)}</div></div>
        <div style="text-align:right">${statusBadges(o)}</div>
      </div>
      ${o.status==="cancelled"?`<div style="margin-top:12px;padding:12px;background:var(--red-soft);border-radius:10px;color:var(--red)">
        Order cancelled.
        ${o.paymentStatus==="refund_requested"?"<br>Refund requested and is being processed.":""}
        ${o.paymentStatus==="refunded"?`<span style="color:var(--green)"><br>✅ Refund has been issued by the store.</span>`:""}
      </div>`:
      `<div class="tl" style="margin-top:18px">${FLOW.map((s,i)=>`
        <div class="tl-step ${i<=idx?"done":""}"><div class="dot"></div>
          <div><strong>${SL[s]}</strong><div class="muted">${i<=idx?"Done":"Waiting"}</div></div>
        </div>`).join("")}</div>`}
      ${canPay?`<div style="border-top:1px solid var(--line);padding-top:14px"><p style="font-weight:600;margin-bottom:10px">💳 Your order is accepted — please pay to proceed</p><div id="payZone"></div></div>`:""}
      ${slipPending?`<div style="border-top:1px solid var(--line);padding-top:12px;margin-top:4px"><p class="muted">⏳ Transfer slip submitted — waiting for store to confirm payment.</p></div>`:""}
      <div style="border-top:1px solid var(--line);padding-top:12px;margin-top:8px">
        ${o.items.map(i=>`<div class="row spread" style="padding:3px 0"><span>${esc(i.name)} × ${i.qty}</span><span class="price">${mvr(i.price*i.qty)}</span></div>`).join("")}
        <div class="row spread" style="margin-top:8px"><strong>Total</strong><strong class="price">${mvr(o.total)}</strong></div>
      </div>
      ${isPaid&&o.status!=="delivered"&&o.status!=="cancelled"?`<div style="margin-top:12px"><button class="btn btn-danger btn-sm" onclick="reqRefund('${oid}')">↩️ Request refund & cancel</button></div>`:""}
    </div>`;
    if(canPay)loadPay(oid,o);
  },()=>{box.innerHTML=`<div class="empty">Could not load order.</div>`});
  unsub.push(u);
}
async function loadPay(oid,o){
  const bd=await db.collection("businesses").doc(o.bizId).get();
  const biz=bd.data()||{};
  const pz=$("payZone");if(!pz)return;
  pz.innerHTML=`
    ${biz.acceptsCard&&biz.cardLink?`<div class="pay-opt" id="poCard" onclick="selPay('card')"><h4>💳 Card payment</h4><div class="muted">Secure card payment</div></div>`:""}
    ${biz.acceptsTransfer!==false?`<div class="pay-opt" id="poTransfer" onclick="selPay('transfer')"><h4>🏦 Bank transfer</h4><div class="muted">${biz.bankName?esc(biz.bankName)+" · "+esc(biz.accountNumber||"")+(biz.accountName?" · "+esc(biz.accountName):""):"Transfer to store account"}</div></div>`:""}
    <div id="payAction"></div>`;
  window._PB=biz;window._PO=oid;window._PT=o.total;
}
window.selPay=method=>{
  document.querySelectorAll(".pay-opt").forEach(el=>el.classList.remove("sel"));
  const pa=$("payAction");
  if(method==="card"){
    $("poCard")?.classList.add("sel");
    pa.innerHTML=`<a href="${esc(window._PB.cardLink)}" target="_blank" class="btn btn-p" style="width:100%;margin-top:8px">Pay ${mvr(window._PT)} by card →</a>
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px" onclick="confirmCardPay()">I've completed the payment</button>`;
  }else{
    $("poTransfer")?.classList.add("sel");
    pa.innerHTML=`<label style="margin-top:12px">Upload your transfer slip</label>
      <input type="file" id="slipFile" accept="image/*" onchange="prevSlip(this)">
      <img id="slipPrev" style="display:none" class="slip-img">

  }
};
window.prevSlip=inp=>{const p=$("slipPrev");if(inp.files[0]){const r=new FileReader();r.onload=e=>{p.src=e.target.result;p.style.display="block"};r.readAsDataURL(inp.files[0])}};
window.confirmCardPay=async()=>{await db.collection("orders").doc(window._PO).update({paymentStatus:"paid",paymentMethod:"card"});toast("Payment recorded — thank you!")};
window.submitSlip=async()=>{
  const f=$("slipFile")?.files[0];if(!f){toast("Please upload the transfer slip");return}
  $("submitSlipBtn").disabled=true;toast("Uploading…");
  const b64=await compressImg(f,900,1100,0.65);
  if(!b64){toast("Could not read image");$("submitSlipBtn").disabled=false;return}
  await db.collection("orders").doc(window._PO).update({paymentStatus:"pending_transfer",paymentMethod:"transfer",transferSlip:b64});

window.reqRefund=async oid=>{
  if(!confirm("Request a refund and cancel this order?"))return;

  toast("Refund requested. The store will process it.");
};

window.bulkCSV=()=>{
  openModal(`<h2>Bulk upload products</h2>

    <div style="background:var(--bg);border-radius:8px;padding:10px;font-family:monospace;font-size:12px;margin:10px 0;color:var(--ink-soft)">name,description,price<br>Chicken Rice,With sauce and salad,45<br>Fish Soup,Fresh daily catch,35.50</div>
    <a href="data:text/csv,name%2Cdescription%2Cprice%0AProduct%20Name%2CDescription%20here%2C0.00" download="products_template.csv" class="btn btn-o btn-sm" style="margin-bottom:12px;display:inline-flex">⬇ Download template</a>
    <label>Choose CSV file</label><input type="file" id="csvFile" accept=".csv,text/csv">
    <div id="csvPrev" style="margin-top:10px"></div>
    <button class="btn btn-p" style="width:100%;margin-top:12px" id="csvImportBtn">Import products</button>`);
  let parsed=[];
  $("csvFile").onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{
      const lines=ev.target.result.split(/\r?\n/).filter(l=>l.trim());
      parsed=lines.slice(1).map(l=>{const c=l.split(",");return{name:(c[0]||"").trim(),desc:(c[1]||"").trim(),price:parseFloat(c[2])||0}}).filter(p=>p.name);
      $("csvPrev").innerHTML=parsed.length?`<p class="muted" style="margin-bottom:6px">Found <strong>${parsed.length}</strong> products:</p><div style="max-height:150px;overflow:auto;background:var(--bg);border-radius:8px;padding:8px">${parsed.map(p=>`<div class="muted" style="padding:3px 0">${esc(p.name)} — ${mvr(p.price)}</div>`).join("")}</div>`:`<p style="color:var(--red)">No valid products found. Check the CSV format.</p>`;
    };r.readAsText(f);
  };
  $("csvImportBtn").onclick=async()=>{
    if(!parsed.length){toast("No products to import");return}
    $("csvImportBtn").disabled=true;$("csvImportBtn").textContent="Importing…";
    const col=db.collection("businesses").doc(myBiz.id).collection("products");
    const batch=db.batch();
    parsed.forEach(p=>batch.set(col.doc(),{name:p.name,desc:p.desc,price:p.price,available:true,imageData:"",createdAt:FV.serverTimestamp()}));
    await batch.commit();closeModal();toast(`${parsed.length} products imported!`);
  };
};

async function genBizReport(){

  $("genRep").disabled=true;$("genRep").textContent="Loading…";
  const snap=await db.collection("orders").where("bizId","==",myBiz.id).get();

  }).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
  $("genRep").disabled=false;$("genRep").textContent="Generate report";
  const revenue=ords.filter(o=>o.status!=="cancelled").reduce((s,o)=>s+o.total,0);

  doc.text(`Period: ${from.toLocaleDateString("en-GB")} – ${to.toLocaleDateString("en-GB")}`,14,35);
  doc.text(`Generated: ${new Date().toLocaleString("en-GB")}`,14,42);
  const rev=ords.filter(o=>o.status!=="cancelled").reduce((s,o)=>s+o.total,0);
  const col=ords.filter(o=>o.paymentStatus==="paid").reduce((s,o)=>s+o.total,0);

};

window.dlAdminPDF=()=>{

  const{rows,gRev,gPaid,ords,from,to}=window._ARD||{rows:[],gRev:0,gPaid:0,ords:[],from:new Date(),to:new Date()};

  doc.text(`Total orders: ${ords.length}  |  Revenue: MVR ${gRev.toFixed(2)}  |  Collected: MVR ${gPaid.toFixed(2)}`,14,36);

};

window.seedCatalog=async()=>{
  if(!confirm("This will add "+SEED_CATALOG.length+" grocery products to the catalog with Maldivian market prices. Continue?"))return;
  openModal(`<h2>🌱 Seeding catalog…</h2>
    <p class="muted">Fetching product images from Open Food Facts — one search per category.</p>
    <div id="seedMsg" style="margin-top:14px;font-weight:600">Starting…</div>
    <div style="background:var(--line);border-radius:99px;height:10px;margin-top:8px"><div id="seedBar" style="background:var(--teal);height:10px;border-radius:99px;width:0;transition:.4s"></div></div>
    <div id="seedDetail" class="muted" style="margin-top:8px"></div>`);
  const cats=Object.keys(SEED_QUERIES);
  const catImgs={};
  for(let i=0;i<cats.length;i++){
    const cat=cats[i];
    if(!$("seedMsg"))break;
    $("seedMsg").textContent="Searching: "+cat+"…";
    $("seedBar").style.width=((i+1)/(cats.length+1)*80)+"%";
    try{
      const n=SEED_CATALOG.filter(p=>p.category===cat).length;
      const r=await fetch("https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(SEED_QUERIES[cat])+"&json=1&page_size="+(n*2+5)+"&fields=image_thumb_url");
      const d=await r.json();
      catImgs[cat]=(d.products||[]).filter(p=>p.image_thumb_url).map(p=>p.image_thumb_url);
    }catch{catImgs[cat]=[]}
    await new Promise(r=>setTimeout(r,350));
  }
  if($("seedMsg"))$("seedMsg").textContent="Writing "+SEED_CATALOG.length+" products to catalog…";
  if($("seedBar"))$("seedBar").style.width="90%";
  const catIdx={};
  const batch=db.batch();
  SEED_CATALOG.forEach(item=>{
    if(!catIdx[item.category])catIdx[item.category]=0;
    const imgs=catImgs[item.category]||[];
    const imageUrl=imgs[catIdx[item.category]++]||"";
    batch.set(db.collection("catalog").doc(),{
      name:item.name,brand:item.brand||"",unit:item.unit||"",
      category:item.category,suggestedPrice:item.suggestedPrice||0,
      imageUrl,createdAt:FV.serverTimestamp()
    });
  });
  await batch.commit();
  if($("seedBar"))$("seedBar").style.width="100%";
  if($("seedMsg"))$("seedMsg").textContent="✅ Done! "+SEED_CATALOG.length+" products added.";
  if($("seedDetail"))$("seedDetail").textContent="Businesses can now browse and add these to their stores.";
  setTimeout(()=>{closeModal();loadCatalog();},2500);
};

window.orderViaWhatsApp=async bizId=>{
  const c=cart[bizId];
  if(!c?.waNumber){toast("This store hasn't enabled WhatsApp ordering.");return}
  const addrs=getAddrs();
  openModal(`<h2>Order via WhatsApp</h2>
    <p class="muted" style="margin-bottom:10px">📲 <strong>${esc(c.bizName)}</strong> · Your order lands in the portal AND goes to the store on WhatsApp.</p>
    <label>Your name</label><input id="wN">
    <label>Phone</label><input id="wP" placeholder="7XXXXXX">
    <label>Delivery address</label>
    <div class="addr-wrap">
      <input id="wA" placeholder="House / road / island" autocomplete="off" oninput="filterWA(this.value)">
      ${addrs.length?`<div class="addr-sug" id="wAddrSug">${addrs.map(a=>`<div onclick="pickWA('${esc(a)}')">${esc(a)}</div>`).join("")}</div>`:""}
    </div>
    <label>Note (optional)</label><input id="wNote">
    <button class="btn btn-wa" style="width:100%;margin-top:16px" id="waBtn">📲 Place order via WhatsApp</button>`);
  $("waBtn").onclick=async()=>{
    const name=$("wN").value.trim(),phone=$("wP").value.trim(),addr=$("wA").value.trim();
    if(!name||!phone||!addr){toast("All fields are required");return}
    $("waBtn").disabled=true;
    const items=Object.entries(c.items).map(([pid,i])=>({productId:pid,name:i.name,price:i.price,qty:i.qty}));
    const total=items.reduce((s,i)=>s+i.price*i.qty,0);
    const code=orderCode();
    try{
      await db.collection("orders").add({
        code,bizId,bizName:c.bizName,
        customer:{name,phone,address:addr,note:$("wNote").value.trim()},
        items,total,status:"new",paymentStatus:"unpaid",source:"whatsapp",
        createdAt:FV.serverTimestamp(),history:[{status:"new",at:new Date().toISOString()}]
      });
      saveAddr(addr);
      saveMyOrder({code,bizName:c.bizName,total,date:new Date().toISOString(),status:"new"});
      const itemsList=items.map(i=>"• "+i.name+" × "+i.qty+" — MVR "+(i.price*i.qty).toFixed(2)).join("\n");
      const trackUrl=location.origin+location.pathname+"#/track/"+code;
      const msg="*Order — Kleio Easy Grocer* 🛒\n\n*Code:* "+code+"\n*Store:* "+c.bizName+"\n\n*Customer:*\nName: "+name+"\nPhone: "+phone+"\nAddress: "+addr+($("wNote").value.trim()?"\nNote: "+$("wNote").value.trim():"")+"\n\n*Items:*\n"+itemsList+"\n\n*Total: MVR "+total.toFixed(2)+"*\n\nTrack: "+trackUrl;
      delete cart[bizId];saveCart();closeModal();
      window.open("https://wa.me/"+c.waNumber.replace(/\D/g,"")+"?text="+encodeURIComponent(msg));
      location.hash="#/track/"+code;
      toast("Order placed! Code: "+code,5000);
    }catch{toast("Could not place order.");$("waBtn").disabled=false}
  };
};

// Known Supermart products with confirmed image URLs, names, prices, categories
const SUPERMART_KNOWN=[
  {name:"Parboiled Rice",brand:"STO",unit:"10kg",category:"Staples & Grains",suggestedPrice:199,slug:"parboiled-rice-10002014-2050000018152"},
  {name:"Happy Cow Cheese Spread",brand:"Happy Cow",unit:"150g",category:"Dairy & Eggs",suggestedPrice:35,slug:"happy-cow-cheese-spread-150g-10067747"},
  {name:"Happy Cow Slice Cheese Cheddar",brand:"Happy Cow",unit:"200g",category:"Dairy & Eggs",suggestedPrice:48,slug:"happy-cow-slice-cheese-cheddar-200g-10086362"},
  {name:"Happy Cow Slice Cheese Regular",brand:"Happy Cow",unit:"200g",category:"Dairy & Eggs",suggestedPrice:45,slug:"happy-cow-slice-cheese-regular-200g-10067751"},
  {name:"Happy Cow Processed Cheese",brand:"Happy Cow",unit:"340g",category:"Dairy & Eggs",suggestedPrice:75,slug:"happy-cow-processed-cheese-340g-------10067749"},
  {name:"Superchef White Vinegar",brand:"Superchef",unit:"1L",category:"Cooking Oils & Condiments",suggestedPrice:19,slug:"superchef-white-vinegar-1l-10064301"},
  {name:"Superchef Toor Dhaal Yellow",brand:"Superchef",unit:"500g",category:"Canned & Tinned",suggestedPrice:18,slug:"superchef-toor-dhaal-yellow---500g-10064343"},
  {name:"Safa Tomato Paste",brand:"Safa",unit:"70g",category:"Cooking Oils & Condiments",suggestedPrice:4,slug:"safa-tomato-paste-70g-000000000010006821"},
  {name:"Bayara Paprika Powder",brand:"Bayara",unit:"100g",category:"Spices & Seasoning",suggestedPrice:22,slug:"bayara-paprika-powder-100ml-10056461"},
  {name:"Tunisian Dates",brand:"",unit:"500g",category:"Snacks & Biscuits",suggestedPrice:45,slug:"tunisian-dates-500g-10007178"},
];
const CORS_PROXY="https://api.allorigins.win/get?url=";
async function fetchSupermartProduct(slug){
  try{
    const r=await fetch(CORS_PROXY+encodeURIComponent("https://estore.mv/Product/Index/"+slug));
    const d=await r.json();
    const html=d.contents||"";
    // Extract name from <title>
    const nameM=html.match(/<title>([^<]+)<\/title>/i);
    const name=nameM?nameM[1].trim():"";
    // Extract price
    const priceM=html.match(/MVR\s*([\d.]+)/);
    const price=priceM?parseFloat(priceM[1]):0;
    // Extract image (Uploads/Products path, not Thumbnails)
    const imgM=html.match(/https:\/\/estore\.mv\/Uploads\/Products\/(?!Thumbnails)[^"'\s]+\.jpg/);
    const imageUrl=imgM?imgM[0]:"";
    // Extract category
    const catM=html.match(/In stock[\s\S]{0,60}?\d{6,}\s*\n\s*([^\n<]+)/);
    const category=catM?catM[1].trim():"";
    return{name,price,imageUrl,category,slug};
  }catch{return null}
}

  openModal(`<h2>🛒 Import from STO Supermart</h2>

window.addKnownSupermart=async()=>{
  if(!window._smSel.size){toast("Select at least one product");return}
  $("smAddKnownBtn").disabled=true;
  const sel=[...window._smSel].map(i=>SUPERMART_KNOWN[i]);
  $("smScrapeOut").innerHTML=`<div class="muted">Fetching ${sel.length} products from Supermart…</div>`;
  const results=[];
  for(const p of sel){
    $("smScrapeOut").innerHTML=`<div class="muted">Fetching: ${esc(p.name)}…</div>`;
    const fetched=await fetchSupermartProduct(p.slug);
    results.push({
      name:fetched?.name||p.name,
      brand:p.brand,unit:p.unit,
      category:p.category,
      suggestedPrice:fetched?.price||p.suggestedPrice,
      imageUrl:fetched?.imageUrl||""
    });
    await new Promise(r=>setTimeout(r,400));
  }
  const batch=db.batch();
  results.forEach(item=>batch.set(db.collection("catalog").doc(),{...item,createdAt:FV.serverTimestamp()}));
  await batch.commit();
  closeModal();
  toast(results.length+" Supermart products added to catalog!");

};
window.scrapeSupermartUrls=async()=>{
  const raw=$("smUrls").value.trim();if(!raw)return;
  const urls=raw.split("\n").map(u=>u.trim()).filter(u=>u.includes("estore.mv/Product/Index/"));
  if(!urls.length){toast("No valid estore.mv URLs found");return}
  $("smScrapeOut").innerHTML=`<div class="muted">Fetching ${urls.length} product(s)…</div>`;
  const results=[];
  for(const url of urls){
    const slug=url.split("/Product/Index/")[1]||"";
    const p=await fetchSupermartProduct(slug);
    if(p&&p.name)results.push(p);
    await new Promise(r=>setTimeout(r,400));
  }
  if(!results.length){$("smScrapeOut").innerHTML=`<p style="color:var(--red)">Could not fetch products. Check the URLs and try again.</p>`;return}
  $("smScrapeOut").innerHTML=`
    <p style="font-weight:600;margin-bottom:8px">Found ${results.length} product(s):</p>
    <div class="cat-grid">${results.map((p,i)=>`
      <div class="cat-card selectable selected" id="smr_${i}" onclick="this.classList.toggle('selected')">
        <div class="sel-check">✓</div>
        ${p.imageUrl?`<img src="${p.imageUrl}" onerror="this.style.display='none'" style="width:70px;height:70px;object-fit:contain;margin:0 auto 8px;display:block">`:""}
        <div class="iname">${esc(p.name)}</div>
        <div class="price" style="font-size:12px;margin-top:4px">${p.price?mvr(p.price):""}</div>
        <label style="font-size:11px;margin-top:6px">Category</label>
        <input value="${esc(p.category||"")}" id="smc_${i}" style="font-size:11px;padding:4px 6px">
      </div>`).join("")}</div>
    <button class="btn btn-p" style="width:100%;margin-top:12px" onclick="confirmScrapedSupermart()">Add selected to catalog</button>`;
  window._smScraped=results;
};
window.confirmScrapedSupermart=async()=>{

};

/* combined status badge HTML used on both customer & business sides */
function statusBadges(o){
  const s=o.status,p=o.paymentStatus||"unpaid";
  // Accepted but unpaid — merge into one clear label
  if(s==="accepted"&&p==="unpaid")
    return`<span class="badge b-unpaid">Accepted · Waiting for payment</span>`;
  if(s==="accepted"&&p==="pending_transfer")
    return`<span class="badge b-pending_transfer">Accepted · Slip submitted</span>`;
  // For all other states show order status + payment badge separately
  let html=`<span class="badge b-${s}">${SL[s]}</span>`;
  if(p==="paid") html+=`<br><span class="badge b-paid" style="margin-top:4px">✅ Paid</span>`;
  else if(p==="pending_transfer") html+=`<br><span class="badge b-pending_transfer" style="margin-top:4px">Slip submitted</span>`;
  else if(p==="refund_requested") html+=`<br><span class="badge b-refund_requested" style="margin-top:4px">Refund requested</span>`;
  else if(p==="refunded") html+=`<br><span class="badge b-refunded" style="margin-top:4px">Refunded</span>`;
  return html;
}
